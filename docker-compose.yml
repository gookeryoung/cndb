version: "3.9"

services:
  app:
    build: .
    image: cndb:latest
    container_name: cndb-app
    command: uv run cndb serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - CNDATABASE_URL=sqlite:////data/cndb.db
    volumes:
      - cndb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cndb-data:
