# ────────────────────────────────────────────────────────────────────
# cndb2 部署编排 — 生产形态
#
# app 容器：FastAPI + SQLAlchemy + 插件（/api/* 动态接口）
# web 容器：nginx 直出前端静态 + SPA fallback + 反代 /api/* 到 app
# PostgreSQL 为可选 profile（--profile pg 启用）
#
# 快速开始（SQLite）:
#   docker compose up -d --build
#   docker compose exec app uv run cndb seed   # 可选，注入演示数据
#
# PostgreSQL:
#   docker compose --profile pg up -d --build
#   docker compose exec app uv run cndb seed
# ────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: cndb2-app:latest
    container_name: cndb2-app
    environment:
      - CNDATABASE_URL=${CNDATABASE_URL:-sqlite:////data/cndb.db}
      - CNDATABASE_URL_PG=${CNDATABASE_URL_PG:-postgresql+psycopg://cndb:cndb_pass@postgres:5432/cndb}
    volumes:
      - cndb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: cndb2-web:latest
    container_name: cndb2-web
    ports:
      - "${CNDB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL（可选 profile）──
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: cndb2-postgres
    profiles: ["pg"]
    environment:
      POSTGRES_USER: cndb
      POSTGRES_PASSWORD: ${CNDB_DB_PASSWORD:-cndb_pass}
      POSTGRES_DB: cndb
    volumes:
      - cndb-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cndb -d cndb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cndb-data:
  cndb-pg-data: