# ────────────────────────────────────────────────────────────────────
# cndb2 部署编排 — 生产形态
#
# app 容器：FastAPI + SQLAlchemy + 插件（/api/* 动态接口）
# web 容器：nginx 直出前端静态 + SPA fallback + 反代 /api/* 到 app
# PostgreSQL 为可选 profile（--profile pg 启用）
#
# 快速开始（SQLite）:
#   docker compose up -d --build
#   docker compose exec app uv run cndb seed   # 可选，注入演示数据
#
# PostgreSQL:
#   --profile pg 只负责把postgres 容器拉起来，app 仍读 CNDATABASE_URL，
#   必须同时显式指向 pg，否则会静默继续用 SQLite（pg 容器空转）：
#   CNDATABASE_URL=postgresql+psycopg://cndb:cndb_pass@postgres:5432/cndb \
#     docker compose --profile pg up -d --build
#   docker compose exec app uv run cndb seed
# ────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: app
    image: cndb2-app:latest
    container_name: cndb2-app
    environment:
      # 数据根目录：数据库/附件/备份/日志统一落在 /data 卷内。
      # 只设 DATABASE_URL 时 UPLOAD_DIR 等仍派生自 ~/.cndb，
      # 容器重建后用户上传的附件会全部丢失。
      - CNDB_DATA_DIR=/data
      # Settings 同时接受 CNDATABASE_URL / DATABASE_URL（见 core/config.py）
      - CNDATABASE_URL=${CNDATABASE_URL:-sqlite:////data/data/cndb.db}
    volumes:
      - cndb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动需跑 alembic 迁移 + create_all，10s 不足以完成，
      # 过短会在服务其实正常时判定 unhealthy，连带 web 容器无法启动
      start_period: 60s

  web:
    build:
      # 必须是仓库根：web target 需要 frontend/ 与 deploy/nginx.conf
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    image: cndb2-web:latest
    container_name: cndb2-web
    ports:
      - "${CNDB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL（可选 profile）──
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: cndb2-postgres
    profiles: ["pg"]
    environment:
      POSTGRES_USER: cndb
      POSTGRES_PASSWORD: ${CNDB_DB_PASSWORD:-cndb_pass}
      POSTGRES_DB: cndb
    volumes:
      - cndb-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cndb -d cndb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cndb-data:
  cndb-pg-data: