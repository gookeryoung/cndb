# Dependabot 自动依赖更新
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # pip 依赖：uv.lock 由 Dependabot 无法直接更新，改用 uv 官方建议的
  # `pip` 生态扫描 pyproject.toml 直接依赖；lockfile 同步由本地 uv lock 完成
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    # Windows(Win7/8) 运行时钉版依赖：上限见 pyproject.toml 的「平台相关钉版约定」。
    # 这些库在 win32 上有版本上限 / 与 pydantic-core、kernel32、ProcessPrng 等绑定，
    # 自动升级（哪怕只是抬非 win32 那条下限）会让 Windows 打包或运行时崩，必须人工改。
    # ignore 只作用于普通版本更新，安全更新仍会照常提出。
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "fastapi-offline"
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-settings"
      - dependency-name: "bcrypt"
      - dependency-name: "cryptography"
  # GitHub Actions：workflow 内 action 版本对齐
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
