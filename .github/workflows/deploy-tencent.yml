name: Deploy to Tencent Cloud

# 触发：由 release.yml 的 pypi job 成功后以 reusable workflow 调用
# （workflow_call），或手动 workflow_dispatch 指定版本重跑/回滚。镜像在服务器端构建。
#
# 为什么不再自己监听 tag push：发布与部署以前是两条并行 workflow，deploy 必须靠
# 轮询 PyPI 元数据来「等」release 发布完（30s × 6 次，最坏 3 分钟）。改成被
# release.yml 调用后，pypi job 成功即代表 wheel 已在 PyPI，部署直接进入下发阶段，
# 这段等待归零；release 失败时 deploy 也不会再抢跑。
#
# 链路：release.yml 的 pypi job 构建前端并发布 wheel → 本 workflow 解析 wheel 地址、
# 国内镜像地址与 sha256（不下载）→ uv export 导出锁定依赖 → 把部署配置（compose +
# deploy/ + 锁定清单）打成 tar.gz + base64 内联进 TAT 命令下发 → 服务器自行下载 wheel
# → deploy.sh（复用/构建依赖基础镜像 → 只重建 wheel 薄层 → 冒烟 → 预备份 → 重建 →
# 健康探测 → 失败自动回滚）→ 复查容器与健康端点。
#
# 用 TAT（自动化助手）下发而非 SSH 直连：GitHub runner 出口 IP 在海外且不固定，SSH 登录
# 会在腾讯云主机安全留下「异地登录」告警；TAT 为下发模型，实例 agent 主动拉取，全程无
# 入站连接，22 端口可对公网关闭。wheel 为 MB 级、超出 TAT 64 KiB 上限，改由服务器自行
# 下载（按「多个国内 PyPI 镜像 → 官方源」顺序尝试，下载后校验 sha256）。
#
# 必需 Secrets：
#   TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY  子账号密钥（勿用主账号）。最小权限：
#       { "effect": "allow", "action": ["tat:RunCommand", "tat:DescribeInvocationTasks"],
#         "resource": ["*"] }
#   CNDB_INSTANCE_ID   Lighthouse 实例 ID，如 lhins-8k8ahx8m
#   CNDB_REGION        实例地域，如 ap-shanghai
#   TCR_REGISTRY / TCR_GROUP   （可选）TCR 域名与命名空间，仅作镜像命名/回滚识别，须成对提供
#   TCR_USERNAME / TCR_PASSWORD （可选）仅手动回滚（docker pull）时使用
#   CNDB_SOURCES （可选）服务器侧构建源 profile，默认 cn（国内镜像）；
#       TAT 命令会显式写入该值，不会继承 GitHub runner 的 global
#   BUILD_BASE_IMAGE / BUILD_PIP_INDEX_URL （可选）单项覆盖，优先级高于 profile
#
# 已废弃、可删除：SSH_HOST / SSH_PORT / SSH_USERNAME / SSH_PRIVATE_KEY（改 TAT 后不再有 SSH 登录）

on:
  # 由 release.yml 在 pypi 成功后调用，保证 wheel 已发布、不再需要等元数据同步
  workflow_call:
    inputs:
      version:
        description: '可选：要部署的版本 tag；省略时使用调用方的 tag'
        required: false
        type: string
        default: ''
  # 手动触发：可重跑部署或回滚到指定 tag（输入已存在的版本号即可）
  workflow_dispatch:
    inputs:
      version:
        description: '要部署的版本 tag（如 v0.3.0）'
        required: true
        type: string

permissions:
  contents: read

# 单机生产只允许一个部署在跑（跨 tag 也串行）：并发部署会导致镜像与 .env 相互覆盖。
# 注意这里用固定 group 而不是 ${{ github.ref }}：否则前后两个 tag 同时发布时会并行改同一台机器。
concurrency:
  group: deploy-tencent-prod
  cancel-in-progress: false

jobs:
  # ===== 打包部署配置并通过 TAT 触发服务器端构建部署 =====
  deploy:
    name: Deploy via TAT (server-side build)
    runs-on: ubuntu-24.04
    # 70 分钟为排障上限；依赖未变化时服务器构建约 20-40s，依赖变化时多一次 1-3 分钟的基础镜像构建。
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      # 安装 uv：后面的 uv export 直接用（不再经 uvx 额外下载一份）
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Resolve version
        id: meta
        run: |
          # 手动触发时用输入的版本，否则用调用方（tag push）的 ref 名
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          # 去掉 tag 的 v 前缀，保持镜像 tag 与 wheel 版本一致。
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VERSION}"

      # 只解析 wheel 地址、国内镜像地址与 sha256（真正下载在服务器做）。
      # 本 workflow 由 pypi job 成功后调用，PyPI 元数据此时已可读；保留少量重试只为
      # 兜住 CDN 传播抖动，不再需要「等发布」那种分钟级轮询。
      - name: Resolve wheel source on PyPI
        id: wheel
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          pkg = "cndb"
          version = os.environ["VERSION"]
          endpoint = f"https://pypi.org/pypi/{pkg}/{version}/json"

          data = None
          last_err = "未知"
          for attempt in range(1, 5):
              try:
                  with urllib.request.urlopen(endpoint, timeout=30) as resp:
                      data = json.load(resp)
                  break
              except urllib.error.HTTPError as exc:
                  last_err = f"HTTP {exc.code}"
              except Exception as exc:  # noqa: BLE001 - 网络抖动一律重试
                  last_err = repr(exc)
              print(f"第 {attempt}/4 次未取到 {pkg}=={version}（{last_err}），15s 后重试…")
              time.sleep(15)

          if data is None:
              sys.exit(f"PyPI 元数据取不到 {pkg}=={version}：{last_err}。请确认 release.yml 的 pypi job 成功。")

          wheels = [u for u in data.get("urls", []) if u["filename"].endswith(".whl")]
          if not wheels:
              sys.exit(f"{pkg}=={version} 没有 wheel 产物（sdist 无法用于镜像构建）")

          whl = wheels[0]
          url = whl["url"]
          # files.pythonhosted.org/packages/xx/yy/... 的路径在国内镜像上保持一致，
          # 因此可以直接把同一段路径拼到各镜像前缀后（镜像未同步时会快速 404）。
          suffix = ""
          if "/packages/" in url:
              suffix = url.split("/packages/", 1)[1].split("#", 1)[0].split("?", 1)[0]
          # 各镜像同步新版本的时间不同（实测同一版本发布后，清华 / 中科大 / 华为
          # 往往先同步，腾讯 / 阿里滞后数分钟），多列几家能显著降低「全部 404 →
          # 只能走跨境官方源」的概率；服务器侧还会按轮重试（见 build_tat_command.py）。
          mirror_bases = [
              "https://mirrors.cloud.tencent.com/pypi",
              "https://mirrors.aliyun.com/pypi",
              "https://pypi.tuna.tsinghua.edu.cn",
              "https://mirrors.ustc.edu.cn/pypi",
              "https://repo.huaweicloud.com/repository/pypi",
          ]
          mirrors = [f"{base}/packages/{suffix}" for base in mirror_bases] if suffix else []

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"url={url}\n")
              fh.write(f"filename={whl['filename']}\n")
              fh.write(f"sha256={whl['digests']['sha256']}\n")
              fh.write(f"mirrors={' '.join(mirrors)}\n")

          print(f"wheel: {whl['filename']}")
          print(f"官方源: {url}")
          for mirror in mirrors:
              print(f"镜像源: {mirror}")
          if not mirrors:
              print("镜像源: <无（URL 不符合 /packages/ 布局），将只用官方源>")
          PY

      # 导出锁定依赖供 Dockerfile.base 构建缓存层使用（依赖未变时复用已构建的基础镜像）。
      # 上一步 setup-uv 已把 uv 放进 PATH，直接调用即可（不必再用 uvx 额外下载一份 uv）。
      # 等价命令：
      #   uv export --frozen --no-hashes --no-dev --no-emit-project -o dist/requirements.lock.txt
      - name: Export locked requirements
        run: |
          mkdir -p dist
          uv export --frozen --no-hashes --no-dev --no-emit-project \
            -o dist/requirements.lock.txt
          echo "--- requirements.lock.txt 概要 ---"
          grep -cE '^[a-zA-Z0-9]' dist/requirements.lock.txt | xargs echo "锁定依赖数:"
          grep -E '^(cffi|bcrypt)==' dist/requirements.lock.txt || {
            echo "::error::锁定清单缺少 cffi/bcrypt（bcrypt 3.x 依赖 cffi，缺失会让镜像内安装失败）"
            exit 1
          }

      # 把部署配置打成载荷并拼出下发命令（载荷只含配置，wheel 由服务器自己下载）。
      # 解包路径由 tar 决定，避免旧的 scp 多源把文件落到 deploy/deploy/ 的隐患。
      - name: Build TAT command
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          # 完整仓库前缀（不含 tag）：deploy.sh 不再从 .env 反推（首次部署场景会拼出
          # docker.io/library/cndb 类错误地址）。TCR_REGISTRY/TCR_GROUP 为可选 Secret，
          # 须成对存在才使用，否则回退默认前缀（仅作本地镜像命名/回滚识别）。
          IMAGE_REPO: ${{ (secrets.TCR_REGISTRY != '' && secrets.TCR_GROUP != '') && format('{0}/{1}/cndb', secrets.TCR_REGISTRY, secrets.TCR_GROUP) || 'ccr.ccs.tencentyun.com/pydev/cndb' }}
          WHEEL_URL: ${{ steps.wheel.outputs.url }}
          WHEEL_MIRROR_URLS: ${{ steps.wheel.outputs.mirrors }}
          WHEEL_NAME: ${{ steps.wheel.outputs.filename }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
          BUILD_BASE_IMAGE: ${{ secrets.BUILD_BASE_IMAGE }}
          BUILD_PIP_INDEX_URL: ${{ secrets.BUILD_PIP_INDEX_URL }}
          # 服务器在腾讯云内网：显式 cn，避免延续本 workflow 的 global profile
          CNDB_SOURCES: cn
        run: |
          set -euo pipefail
          tar -czf /tmp/cndb-deploy-config.tgz \
            docker-compose.prod.yml deploy dist/requirements.lock.txt
          ls -la /tmp/cndb-deploy-config.tgz
          python3 scripts/build_tat_command.py

      # 下发并等待；deploy.sh 日志随命令输出回传，失败时可直接看到卡在哪一步。
      - name: Deploy via TAT
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          python3 scripts/deploy_via_tat.py \
            --region "${{ secrets.CNDB_REGION }}" \
            --instance-id "${{ secrets.CNDB_INSTANCE_ID }}" \
            --command-file /tmp/cndb-deploy-cmd.sh \
            --timeout 3600 \
            --max-wait 3300 \
            --poll-interval 5

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::部署失败。若 deploy.sh 已自动回滚，服务仍运行在上一版本。"
          echo "::error::TAT 回传的输出有长度上限，完整日志需上机查看："
          echo "::error::  docker logs --tail 100 cndb"
          echo "::error::若卡在依赖基础镜像构建（首次或 uv.lock 变化后），多为拉基础镜像/apt/pip 超时："
          echo "::error::默认 CNDB_SOURCES=cn 已走国内镜像；仍失败可配置 BUILD_BASE_IMAGE / BUILD_PIP_INDEX_URL 单项覆盖后重跑。"
          echo "::error::若报『命令内容超过 64 KiB』，说明配置载荷过大，见 scripts/build_tat_command.py 的提示。"
