name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # .npmrc 固定走中科大镜像（国内本地开发用），但 GitHub runner 在海外，
      # 跨境访问该镜像会极慢甚至挂起导致 pnpm install 卡死。
      # lockfile 中无 tarball URL 条目，换官方源不会触发 lockfile resolution 校验失败，
      # 故 CI 用 npm_config_registry 覆盖回官方源。
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: ESLint
        run: cd frontend && pnpm lint

      - name: Frontend tests + coverage
        run: cd frontend && pnpm test:coverage

      - name: Build frontend
        run: cd frontend && pnpm build

      # 关键 chunk（主入口 / GridPage）gzip 体积门禁：基线 +5% 容差，超限失败
      - name: Bundle size budget
        run: cd frontend && pnpm bundle:budget

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 --cov-report=term-missing -n auto

  e2e:
    name: E2E (Playwright) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 观察期：先 continue-on-error 收集稳定性数据，稳定后收紧为门禁并扩全量 + --shard
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 按 spec 文件分片并行到 4 台 runner，单层 E2E 耗时约降为 1/4（随新增 spec 可调大）
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync backend deps
        run: uv sync --frozen --extra dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 同上：CI 用官方源覆盖 .npmrc 的中科大镜像，避免海外 runner 跨境访问卡死
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend (static -> src/cndb/static)
        run: cd frontend && pnpm build

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E (webServer 自动 seed + 起后端 :8000，不含 @perf)
        env:
          CI: "true"
          E2E_SHARD_INDEX: ${{ matrix.shard }}
        run: cd frontend && pnpm e2e -- --shard=${{ matrix.shard }}/4 --grep-invert="tag:@perf"

      # @perf 用例必须串行独占：并行 worker 抢 CPU 时 LCP 读数反映争抢而非页面性能
      - name: Run perf 冒烟（shard 1 内串行独占，观察期）
        if: matrix.shard == 1
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --project=chromium-authed tests/e2e/perf --workers=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
