name: CI

on:
  push:
    branches: [main, develop]
    # 路径过滤：仅对影响运行的文件变化触发全量 CI；&ci_paths 锚点供 pull_request 复用，避免两份列表漂移。
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/scripts/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/playwright.config.ts'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'pyproject.toml'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.python-version'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  workflow_dispatch:  # 手动触发可绕过 paths 过滤跑全量

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: lint
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # pyproject 固定腾讯 PyPI 镜像（供国内开发），海外 runner 访问会超时；
      # CI 用 UV_DEFAULT_INDEX 覆盖回官方源。
      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      # ruff check + format 合并为单步，format 复用 check 的 cache-dir 减少重复扫描
      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      # pyrefly 默认单线程（Makefile 用 -j 0 并行），CI 同步加上；
      # .pyrefly_cache 已在 .gitignore，命中缓存即秒级返回。
      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # .npmrc 固定 npmmirror 镜像（供国内开发），海外 runner 跨境访问会卡死。
      # lockfile 仅含 integrity、无 tarball URL，换官方源不会触发 resolution 校验失败，
      # 故 CI 用 npm_config_registry 覆盖回官方源。
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: ESLint
        run: cd frontend && pnpm lint

      - name: Frontend tests + coverage
        run: cd frontend && pnpm test:coverage

      - name: Build frontend
        run: cd frontend && pnpm build

      # 关键 chunk（主入口 / GridPage / ChartView）gzip 体积门禁：基线 +5% 容差，超限失败。
      # 基线在 frontend/scripts/bundle-budget.json（勿手改），超限输出会带 Top-N 源文件归因；
      # 确属合理增长走 scripts/bundle-budget.mjs --update --reason "…"，理由随 JSON 提交。
      # 详见 docs/BUNDLE_BUDGET.md
      - name: Bundle size budget
        run: cd frontend && pnpm bundle:budget

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: test
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      # 2 核 runner：显式 -n 2（-n auto 结果相同，显式更明确）。
      - name: Run tests
        run: uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 --cov-report=term-missing -n 2

  e2e:
    name: E2E (Playwright) shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # E2E 已是硬门禁（曾因 continue-on-error 漏放真实回归）；
    # 抖动由 CI retries=2 与 workers=4 兜底（见 frontend/playwright.config.ts）。
    strategy:
      fail-fast: false
      matrix:
        # 按 spec 文件分片并行到 4 台 runner，单层 E2E 耗时约降为 1/4（随新增 spec 可调大）
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # 4 个分片各自独立缓存键，避免同 key 抢占（Failed to reserve cache）
          cache-suffix: e2e-shard-${{ matrix.shard }}

      - name: Sync backend deps
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 同上：CI 用官方源覆盖 .npmrc 的 npmmirror 镜像，避免海外 runner 跨境卡死
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend (static -> src/cndb/static)
        run: cd frontend && pnpm build

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml','frontend/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install --with-deps chromium

      # 参数须直接跟在脚本名后（`pnpm e2e --shard=...`）；写成 `-- --shard` 会被 pnpm 原样透传给
      # playwright，--shard/--grep-invert 被当位置参数忽略，分片与排除静默失效。
      - name: Run E2E (webServer 自动 seed + 起后端 :8000，不含 @perf)
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --shard=${{ matrix.shard }}/4 --grep-invert="tag:@perf"

      # @perf 用例必须串行独占：并行 worker 抢 CPU 时 LCP 读数反映争抢而非页面性能
      - name: Run perf 冒烟（shard 1 内串行独占，观察期）
        if: matrix.shard == 1
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --project=chromium-authed tests/e2e/perf --workers=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
