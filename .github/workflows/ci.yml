name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: ESLint
        run: cd frontend && pnpm lint

      - name: Frontend tests + coverage
        run: cd frontend && pnpm test:coverage

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      
      

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 --cov-report=term-missing -n auto

  e2e:
    name: E2E (Playwright) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 观察期：先 continue-on-error 收集稳定性数据，稳定后收紧为门禁并扩全量 + --shard
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 按 spec 文件分片并行到 4 台 runner，单层 E2E 耗时约降为 1/4（随新增 spec 可调大）
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync backend deps
        run: uv sync --frozen --extra dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend (static -> src/cndb/static)
        run: cd frontend && pnpm build

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E (webServer 自动 seed + 起后端 :8000)
        env:
          CI: "true"
          E2E_SHARD_INDEX: ${{ matrix.shard }}
        run: cd frontend && pnpm e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
