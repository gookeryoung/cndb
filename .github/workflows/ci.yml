name: CI

on:
  push:
    branches: [main, develop]
    # 路径过滤：只对真正影响运行的文件变化触发；docs/examples/deploy/.trae 等改动
    # 不触发全量 CI，节省 runner 资源。手动触发 workflow_dispatch 可绕过此限制。
    # 用 paths-ignore 比 paths 更不容易漏：默认全量触发，只排除明显无关的。
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'deploy/**'
      - '.trae/**'
      - '.trae-cn/**'
      - 'frontend/dist/**'
      - 'frontend/node_modules/**'
      - 'frontend/playwright-report/**'
      - 'frontend/test-results/**'
      - '.benchmarks/**'
      - '*.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'deploy/**'
      - '.trae/**'
      - '.trae-cn/**'
      - 'frontend/dist/**'
      - 'frontend/node_modules/**'
      - 'frontend/playwright-report/**'
      - 'frontend/test-results/**'
      - '.benchmarks/**'
      - '*.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitattributes'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:  # 手动触发可绕过 paths 过滤跑全量

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      # ruff check + format 合并为单步，format 复用 check 的 cache-dir 减少重复扫描
      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      # pyrefly 默认单线程（本项目 Makefile 用 -j 0 自动并行），CI 同步加上；
      # 缓存目录 .pyrefly_cache 已在 .gitignore，首次构建会存中间产物，后续命中即秒级返回。
      - name: Cache pyrefly
        uses: actions/cache@v4
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # .npmrc 固定走中科大镜像（国内本地开发用），但 GitHub runner 在海外，
      # 跨境访问该镜像会极慢甚至挂起导致 pnpm install 卡死。
      # lockfile 中无 tarball URL 条目，换官方源不会触发 lockfile resolution 校验失败，
      # 故 CI 用 npm_config_registry 覆盖回官方源。
      # --prefer-offline：setup-node 的 pnpm store 命中时直接用缓存，省掉 registry 解析 ~10s。
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: ESLint
        run: cd frontend && pnpm lint

      # vitest transform cache（.vitest-cache）—— 第二次跑 CI 时源码不变则 transform 秒级。
      # 键按 package.json + tsconfig + vite.config 哈希，源码变动会自动失效。
      - name: Cache vitest
        uses: actions/cache@v4
        with:
          path: frontend/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('frontend/package.json','frontend/vite.config.ts','frontend/tsconfig*.json') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Frontend tests + coverage
        run: cd frontend && pnpm test:coverage

      - name: Build frontend
        run: cd frontend && pnpm build

      # 关键 chunk（主入口 / GridPage / ChartView）gzip 体积门禁：基线 +5% 容差，超限失败。
      # 基线在 frontend/scripts/bundle-budget.json（勿手改），超限输出会带 Top-N 源文件归因；
      # 确属合理增长走 scripts/bundle-budget.mjs --update --reason "…"，理由随 JSON 提交。
      # 详见 docs/BUNDLE_BUDGET.md
      - name: Bundle size budget
        run: cd frontend && pnpm bundle:budget

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      # GitHub hosted runner 默认 ubuntu-latest = 2 核 7GB；
      # -n auto 在 2 核上最多也是 2，但显式 -n 2 消除自动探测开销，语义明确。
      - name: Run tests
        run: uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 --cov-report=term-missing -n 2

  e2e:
    name: E2E (Playwright) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 观察期：先 continue-on-error 收集稳定性数据，稳定后收紧为门禁并扩全量 + --shard
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 按 spec 文件分片并行到 4 台 runner，单层 E2E 耗时约降为 1/4（随新增 spec 可调大）
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync backend deps
        run: uv sync --frozen --extra dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 同上：CI 用官方源覆盖 .npmrc 的中科大镜像，避免海外 runner 跨境访问卡死
      # --prefer-offline：setup-node 的 pnpm store 命中时跳过 registry 解析
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile --prefer-offline

      - name: Build frontend (static -> src/cndb/static)
        run: cd frontend && pnpm build

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml','frontend/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E (webServer 自动 seed + 起后端 :8000，不含 @perf)
        env:
          CI: "true"
          E2E_SHARD_INDEX: ${{ matrix.shard }}
        run: cd frontend && pnpm e2e -- --shard=${{ matrix.shard }}/4 --grep-invert="tag:@perf"

      # @perf 用例必须串行独占：并行 worker 抢 CPU 时 LCP 读数反映争抢而非页面性能
      - name: Run perf 冒烟（shard 1 内串行独占，观察期）
        if: matrix.shard == 1
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --project=chromium-authed tests/e2e/perf --workers=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
