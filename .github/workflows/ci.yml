name: CI

on:
  push:
    branches: [main, develop]
    # 路径过滤：&ci_paths 锚点供 pull_request 复用，避免两份列表漂移。
    # docs/adr/** 与 CHANGELOG.md 只为 ADR 落地校验而纳入：这类改动会让重活 job 全部跳过，
    # 只跑 ADR Landing（原独立 workflow adr-check.yml 已并入本文件，一次推送只出现一个 workflow）。
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/scripts/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/playwright.config.ts'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'pyproject.toml'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.python-version'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - 'docs/adr/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  workflow_dispatch:  # 手动触发可绕过 paths 过滤跑全量

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 判定本次推送是否只有 ADR 文档 / ADR 校验脚本变化：
  # 是 → 只跑 ADR Landing；否（含首次推送 / 手动触发）→ 跑全量门禁。
  changes:
    name: Detect change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要与 base commit 做 diff：PR 对比 base.sha，push 对比 before，浅克隆拿不到
          fetch-depth: 0

      - name: Detect ADR-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 首次推送 / 手动触发 / force push（base 已不在历史）按代码改动处理（fail-safe 跑全量）
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          # 变更文件全部落在 ADR / CHANGELOG / ADR 校验脚本内时，全量 job 无判别力
          if [ -z "${changed}" ] || ! printf '%s\n' "${changed}" | grep -qvE '^(docs/adr/|CHANGELOG\.md$|scripts/check_adr_landing\.py$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # 原独立 workflow adr-check.yml 的 job，合并后仅承接 ADR-only 推送；
  # 代码推送时改由 lint 顺带执行同一条命令（两者互斥，不重复起 runner）。
  adr-check:
    name: ADR Landing
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: adr
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # pyproject 固定腾讯 PyPI 镜像（供国内开发），海外 runner 访问会超时，故覆盖回官方源。
      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      # 不用 --strict：ADR 评审状态（Proposed → Accepted）由人工回填，
      # 常驻的「待评审」告警不应阻断 CI；路径缺失 / 落地表缺项 / CHANGELOG 缺条目均为 error。
      - name: Check ADR landing
        run: uv run python scripts/check_adr_landing.py

  lint:
    name: Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: lint
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # pyproject 固定腾讯 PyPI 镜像（供国内开发），海外 runner 访问会超时；
      # CI 用 UV_DEFAULT_INDEX 覆盖回官方源。
      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      # ADR 落地状态表 / 交接节 / Related 链接 / CHANGELOG 关联；
      # 与 ADR Landing job 同口径，代码推送时在这里顺带校验（复用已装好的 uv 环境）。
      - name: Check ADR landing
        run: uv run python scripts/check_adr_landing.py

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      # ruff check + format 合并为单步，format 复用 check 的 cache-dir 减少重复扫描
      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      # pyrefly 默认单线程（Makefile 用 -j 0 并行），CI 同步加上；
      # .pyrefly_cache 已在 .gitignore，命中缓存即秒级返回。
      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  # 前端门禁拆成 4 个 job：静态检查 / 构建 / 测试分片 / 覆盖率合流。
  # 原「Frontend Check」单 job 内 vitest 全量跑 317s，是整条 CI 的关键路径（其余 job 均 <180s）；
  # 拆开后 vitest 按 --shard 分摊到 3 台 runner，关键路径压到其 1/3 + 合流开销。
  frontend-static:
    name: Frontend Static
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # .npmrc 固定 npmmirror 镜像（供国内开发），海外 runner 跨境访问会卡死。
      # lockfile 仅含 integrity、无 tarball URL，换官方源不会触发 resolution 校验失败，
      # 故 CI 用 npm_config_registry 覆盖回官方源。
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: ESLint
        run: cd frontend && pnpm lint

  frontend-build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd frontend && pnpm build

      # 关键 chunk（主入口 / GridPage / ChartView）gzip 体积门禁：基线 +5% 容差，超限失败。
      # 基线在 frontend/scripts/bundle-budget.json（勿手改），超限输出会带 Top-N 源文件归因；
      # 确属合理增长走 scripts/bundle-budget.mjs --update --reason "…"，理由随 JSON 提交。
      # 详见 docs/BUNDLE_BUDGET.md
      - name: Bundle size budget
        run: cd frontend && pnpm bundle:budget

      # 构建产物供 4 个 E2E 分片复用：原先每个分片各 build 一次（4×26s）。
      - name: Upload static bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-bundle
          path: src/cndb/static
          retention-days: 3

  frontend-test:
    name: Frontend Test shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # 单分片失败即整轮失败，无需等其余分片跑完
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      # 覆盖率统计必须留在分片内（v8 只上报本进程加载过的文件），由 blob 携带到合流 job，
      # 因此这里只开 coverage、不判定门槛；门槛统一在 frontend-coverage 里对合并结果判定。
      # blob 目录必须只放 blob 文件（--mergeReports 会拒绝目录内的非 blob 条目），
      # 故覆盖率报告写到 coverage-shard/，与 blob-report/ 分开。
      - name: Vitest shard ${{ matrix.shard }}/3
        run: |
          cd frontend
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/3 \
            --reporter=blob \
            --outputFile.blob=blob-report/report-${{ matrix.shard }}.blob \
            --coverage.enabled=true \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage-shard-${{ matrix.shard }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1

  frontend-coverage:
    name: Frontend Coverage Gate
    needs: [changes, frontend-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      # merge-multiple 把 3 个 blob 落到同一目录，目录内只有 *.blob 才符合 --mergeReports 要求
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: frontend/blob-report
          merge-multiple: true

      # --mergeReports 只回放 blob（不重跑用例，实测 ~5s），据此重算合并覆盖率并判双门槛
      - name: Merge & gate coverage
        run: |
          cd frontend
          pnpm exec vitest run \
            --mergeReports=blob-report \
            --coverage.enabled=true \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage
          node scripts/check-coverage.mjs

  test:
    name: Test (Python 3.12)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: test
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      # 4 vCPU runner：-n 4 与核数对齐（实测 n4 比 n2 快约 1.6×；再往上受 SQLite 单文件写锁限制，
      # 本机 24 核实测 n8 收益已明显收敛）。
      # 覆盖率阈值只在 pyproject [tool.coverage.report].fail_under 维护，此处不再重复传 --cov-fail-under。
      - name: Run tests
        run: uv run pytest -m "not slow" --cov=cndb --cov-report=term-missing -n 4

  e2e:
    name: E2E (Playwright) shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # E2E 已是硬门禁（曾因 continue-on-error 漏放真实回归）；
    # 抖动由 CI retries=2 与 workers=4 兜底（见 frontend/playwright.config.ts）。
    # 依赖 frontend-build 复用静态产物：原先 4 个分片各自 pnpm build（4×26s），
    # 而 webServer 只读 src/cndb/static，产物可直接由 artifact 灌入。
    needs: [changes, frontend-build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 按 spec 文件分片并行到 4 台 runner，单层 E2E 耗时约降为 1/4（随新增 spec 可调大）
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Download static bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-static-bundle
          path: src/cndb/static

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # 4 个分片各自独立缓存键，避免同 key 抢占（Failed to reserve cache）
          cache-suffix: e2e-shard-${{ matrix.shard }}

      - name: Sync backend deps
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 同上：CI 用官方源覆盖 .npmrc 的 npmmirror 镜像，避免海外 runner 跨境卡死
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml','frontend/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install --with-deps chromium

      # 参数须直接跟在脚本名后（`pnpm e2e --shard=...`）；写成 `-- --shard` 会被 pnpm 原样透传给
      # playwright，--shard/--grep-invert 被当位置参数忽略，分片与排除静默失效。
      - name: Run E2E (webServer 自动 seed + 起后端 :8000，不含 @perf)
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --shard=${{ matrix.shard }}/4 --grep-invert="tag:@perf"

      # @perf 用例必须串行独占：并行 worker 抢 CPU 时 LCP 读数反映争抢而非页面性能
      - name: Run perf 冒烟（shard 1 内串行独占，观察期）
        if: matrix.shard == 1
        env:
          CI: "true"
        run: cd frontend && pnpm e2e --project=chromium-authed tests/e2e/perf --workers=1

      # dev 模式 E2E（vite dev 源码直出）：生产构建会绕开 rc-field-form 的 es barrel，
      # 登录页崩溃（2026-10-20）那类依赖补丁回归只在 dev 现形，常规 e2e 全绿也发现不了。
      # 无需 build 产物，webServer 自起隔离后端；串行 1 worker，约 1 分钟
      - name: Run dev-mode E2E (vite dev，兜 dev-only 回归)
        if: matrix.shard == 1
        env:
          CI: "true"
        run: cd frontend && pnpm e2e:dev

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
