name: ADR Check

# 只校验 docs/adr 的落地一致性（落地状态表 / 交接节 / Related 链接 / CHANGELOG 关联），
# 依赖极少，故独立于 ci.yml：ADR 与 CHANGELOG 的改动不必触发全量测试与 E2E。
on:
  push:
    branches: [main, develop]
    paths: &adr_paths
      - 'docs/adr/**'
      - 'CHANGELOG.md'
      - 'scripts/check_adr_landing.py'
      - '.github/workflows/adr-check.yml'
  pull_request:
    branches: [main, develop]
    paths: *adr_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr-check:
    name: ADR Landing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: adr
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # pyproject 固定腾讯 PyPI 镜像（供国内开发），海外 runner 访问会超时，故覆盖回官方源。
      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      # 不用 --strict：ADR 评审状态（Proposed → Accepted）由人工回填，
      # 常驻的「待评审」告警不应阻断 CI；路径缺失 / 落地表缺项 / CHANGELOG 缺条目均为 error。
      - name: Check ADR landing
        run: uv run python scripts/check_adr_landing.py
