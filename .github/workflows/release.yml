name: Release

# 触发：push v*.*.* tag
#
# 三个并行 job：
#   - pypi        : 前端构建 → uv build → uv publish（OIDC）→ 上传 sdist/wheel artifact
#   - pack-windows: windows-latest 原生打包（NSIS + mingw-w64）
#   - pack-linux   : ubuntu-latest  原生打包（gcc + dpkg-dev）
# 另有 deploy-tencent job：pypi 成功后调用部署 workflow（workflow_call），
# 保证「wheel 已发布」才下发部署，省掉部署侧等待 PyPI 元数据的分钟级轮询。
#
# release job 依赖以上三个打包 job，收集构建产物（exe/deb/tar.gz/zip）+
# PyPI 产物（whl/sdist），统一上传到 GitHub Release。
# 任一前置 job 失败时 release 仍尝试发布已成功产物，但最终标记 workflow 失败。

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== PyPI 发布 =====
  pypi:
    name: Build & Publish PyPI
    runs-on: ubuntu-24.04
    environment: pypi
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: release
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check .gitkeep sentinels
        run: uv run python scripts/check_gitkeep.py

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (OIDC)
        # --check-url：同版本文件已存在时跳过上传。本仓库 CodeUp / GitHub 两条
        # release 流水线都会发布同一 tag，后到的一边不再因 400 duplicate 失败。
        run: uv publish --check-url https://pypi.org/simple/

      - name: Upload sdist & wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ===== 生产部署（pypi 成功后）=====
  # 调用独立的部署 workflow（workflow_call），而不是让 deploy 自己监听 tag：
  #  · pypi 成功 = wheel 已在 PyPI，部署侧不必再轮询等元数据（最坏省 3 分钟）；
  #  · pack-windows / pack-linux 与本 job 无关，不会拖慢发布上机。
  #
  # if: always() 是刻意的：本仓库同时向 CodeUp 与 GitHub 推 tag，两边都会发 PyPI，
  # 后到的一边可能因「文件已存在」失败。此时 wheel 其实已在 PyPI 上（先到的那条
  # 流水线发的），部署仍应继续 —— deploy job 自己会解析 PyPI 元数据，取不到才报错。
  deploy-tencent:
    name: Deploy to Tencent Cloud
    needs: pypi
    if: always() && !cancelled()
    uses: ./.github/workflows/deploy-tencent.yml
    # 显式传 tag，不依赖被调用 workflow 里的 GITHUB_REF_NAME（上下文语义更直白）
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  # ===== Windows 原生打包（fspack）=====
  pack-windows:
    name: Pack (Windows native)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # 与 pypi job 分别缓存，避免同一 key 抢占（Failed to save: Unable to reserve cache）
          cache-suffix: release-build
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      # windows-2025 移除了 NSIS，故用 choco 安装；pwsh 下写 $GITHUB_PATH 必须加 $env:
      # 前缀，否则被当作 PowerShell 变量（$null），PATH 不写入、后续找不到 makensis。
      - name: Install NSIS & mingw-w64
        shell: pwsh
        run: |
          choco install nsis mingw -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\mingw-w64\mingw64\bin"

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen

      # fspack 的 download_wheels 依赖 pip，而 uv venv 默认不含 pip，故显式安装到 venv。
      - name: Install pip
        run: uv pip install pip

      - name: Cache fspack assets
        uses: actions/cache@v6
        with:
          path: ~/.fspack/cache/
          key: fspack-windows-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fspack-windows-
            fspack-

      # 国内镜像未同步 PEP 658 `.whl.metadata`（声明支持但文件 404）会让 pip 解析直接失败，
      # 故追加官方 PyPI 为 extra-index。该参数仅 build 子命令支持，package(--no-build) 无需指定。
      - name: Build with fspack
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack b . --target windows --extra-index-url https://pypi.org/simple/

      - name: Generate installer
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack p . --target windows --format all --no-build

      - name: Smoke test (info)
        run: ./dist/cndb.exe info

      - name: Assert artifacts
        shell: bash
        run: |
          test -f dist/release/cndb-*-windows-*-setup.exe
          test -f dist/release/cndb-*-windows-*.zip

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pack-windows-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== Linux 原生打包（fspack）=====
  pack-linux:
    name: Pack (Linux native)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: release-publish
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc dpkg-dev

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen

      # fspack 的 download_wheels 依赖 pip，而 uv venv 默认不含 pip，故显式安装到 venv。
      - name: Install pip
        run: uv pip install pip

      - name: Cache fspack assets
        uses: actions/cache@v6
        with:
          path: ~/.fspack/cache/
          key: fspack-linux-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fspack-linux-
            fspack-

      - name: Build with fspack
        run: uv run fspack b . --target linux --extra-index-url https://pypi.org/simple/

      - name: Generate installer
        run: uv run fspack p . --target linux --format all --no-build

      - name: Smoke test (info)
        run: ./dist/cndb info

      - name: Assert artifacts
        run: |
          test -f dist/release/cndb-*-linux-*.tar.gz
          test -f dist/release/cndb_*-slim_amd64.deb
          test -f dist/release/cndb-*-linux-*.zip

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pack-linux-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== 收集产物并上传到 GitHub Release =====
  release:
    name: Upload to GitHub Release
    needs: [pypi, pack-windows, pack-linux]
    runs-on: ubuntu-24.04
    if: always() && !cancelled()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/

      - name: Collect release files
        run: |
          mkdir -p release-files/
          # 构建产物（exe/deb/tar.gz/zip）+ PyPI 产物（whl/sdist）
          # sdist 也是 .tar.gz，但命名 cndb-<version>.tar.gz 不与 Linux 便携包冲突
          find release-assets/ -type f \
            \( -name "*.exe" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) \
            -exec cp {} release-files/ \;
          echo "::group::Release files"
          ls -la release-files/
          echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        # 幂等：release 已存在则上传产物（--clobber 覆盖同名 asset），不存在则创建，
        # 以支持重打 tag 触发时上一次 run 已创建 release 的场景。release job 无 checkout，
        # gh 无法从 git remote 推断仓库，必须用 GH_REPO 显式指定。
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，上传产物（覆盖同名 asset）..."
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes \
              release-files/*
          fi

      - name: Report failure (if any upstream job failed)
        if: contains(needs.pypi.result, 'failure') || contains(needs.pack-windows.result, 'failure') || contains(needs.pack-linux.result, 'failure')
        run: |
          echo "::error::部分 job 失败（pypi=${{ needs.pypi.result }} windows=${{ needs.pack-windows.result }} linux=${{ needs.pack-linux.result }}），已成功的产物已上传到 Release。"
          exit 1
