# Directories where isort/UP rules do not apply: examples holds data samples,
# alembic matches migration directories at any level by gitignore semantics (including src/cndb/alembic)
extend-exclude = ["examples", "alembic"]
line-length    = 120
target-version = "py312"

[lint]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLC0415", # import should be at top-level (intentional for lazy imports)
    "PLR0911", # too many return statements (intentional for data-processing pipelines)
    "PLR0912", # too many branches (intentional for URL validation / type inference)
    "PLR0913", # too many arguments (FastAPI routes naturally take several path params + Depends)
    "PLR0915", # too many statements (intentional for complex methods)
    "PLR0917", # too many positional arguments (same as above)
    "PLR2004", # magic value comparison
    "PLW2901", # for-loop variable overwritten (acceptable for the simplified _resolve_path syntax)
    "RUF001",  # ambiguous unicode characters in string
    "RUF002",  # ambiguous unicode characters in docstring
    "RUF003",  # ambiguous unicode characters in comment
    "RUF012",  # mutable class attributes (intentional for config)
    "RUF030",  # FastAPI path params must keep Annotated[type, Path(...)] even with a single annotation
    "SIM108",  # use ternary operator
    # UP045: runner.py CLI evaluates annotations via argparse + typing.get_type_hints(),
    # keeping Optional[X] is safer
    "UP045",
    "B008", # FastAPI Depends in default arguments is the standard pattern, B008 is a false positive
]
select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002", "ARG005"]
