# prek / pre-commit 配置
# See https://pre-commit.com for more information
repos:
  # 本地钩子：保护关键 .gitkeep（缺失会使 hatchling force-include 在 CI 上 FileNotFoundError）
  - repo: local
    hooks:
      - id: gitkeep-check
        name: 校验关键 .gitkeep 文件
        entry: python scripts/check_gitkeep.py
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 版本须与 pyproject.toml [project.optional-dependencies].lint 的 ruff== 一致
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
