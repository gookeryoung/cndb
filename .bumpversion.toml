[tool.bumpversion]
current_version = "0.5.6"
commit = true
exclude = ["template/*"]
message = "chore: bump version {current_version} → {new_version}"
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(version\s+=\s+)"{current_version}"'
replace = '\1"{new_version}"'

[[tool.bumpversion.files]]
filename = "src/cndb/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# uv.lock records the editable package's own version (the line under `name = "cndb"`); a bump
# that skips it leaves the committed lock inconsistent with pyproject, so the next `uv run` /
# `uv sync` dirties uv.lock again.
# The match MUST be anchored to the cndb package block: a bare `version = "{current_version}"`
# also hits the prek package (same version number at the time), rewriting its version while its
# wheel / sdist URLs still say the old one — uv then refuses to parse the lock entirely
# ("entry for package `prek` has wheel ... with inconsistent version").
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = '(?m)^name = "cndb"\nversion = "{current_version}"'
replace = 'name = "cndb"\nversion = "{new_version}"'
