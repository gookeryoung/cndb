# pnpm 10+ 依赖构建脚本白名单（msw 的 postinstall 仅复制 service worker；esbuild 需平台二进制；
# core-js 的 postinstall 仅打印赞助信息，无需构建）
allowBuilds:
  core-js: false
  esbuild: true
  msw: true

# pnpm 10.13+/12 起配置统一迁至本文件，package.json 的 pnpm.patchedDependencies 已被忽略
# 补丁清单见 scripts/check-patches.mjs（ADR 0074 D5：rc-field-form 摇树补丁随 antd 6 移除；
# @rc-component/util 的 isEqual 补丁由 pnpm patch-commit 自动登记）
patchedDependencies:
  '@rc-component/util': patches/@rc-component__util.patch
  react-dom@19.3.1: patches/react-dom@19.3.1.patch
