# pnpm 10+ 依赖构建脚本白名单（msw 的 postinstall 仅复制 service worker；esbuild 需平台二进制；
# core-js 的 postinstall 仅打印赞助信息，无需构建）
allowBuilds:
  core-js: false
  esbuild: true
  msw: true

# pnpm 10.13+/12 起配置统一迁至本文件，package.json 的 pnpm.patchedDependencies 已被忽略
patchedDependencies:
  rc-field-form@2.7.1: patches/rc-field-form@2.7.1.patch
  rc-util: patches/rc-util.patch
