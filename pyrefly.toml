preset           = "strict"
project-excludes = [".venv/**", "tests/**", "scripts/**"]
project-includes = ["**/*.py*"]
python-version   = "3.12"
# Pin win32: cli/service.py (winreg) + gui/** (ctypes.WinDLL etc.) are Windows-only
# implementations and need the Windows stdlib stubs to type-check; switching to linux makes
# those modules report 18 missing-attribute errors (cloud Linux runtime is unaffected, this is
# only the type-check scope).
python-platform  = "win32"
search-path      = ["src", "."]
