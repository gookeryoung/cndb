# ═══════════════════════════════════════════════════════════════════
# CNB 部署凭证模板 —— 复制到密钥仓库 gkzhou/cndb-secrets 的 deploy-env.yml
#
# 为什么放在独立密钥仓库：
#   .cnb.yml 通过 imports 读取本文件。若把凭证写进主仓库，
#   任何能读代码的人（含 fork、CI 日志、git 历史）都能拿到生产凭证。
#   独立仓库 + 公开只读 raw，既能被流水线拉到，又不进主仓库历史。
#
# 使用步骤：
#   1. CNB 上创建仓库 gkzhou/cndb-secrets（可见性选 Public —
#      CNB 要求imports 目标可匿名读取；若你的实例支持密钥仓库，
#      改用私有 + 授权亦可）
#   2. 把本文件内容复制进去，改名为 deploy-env.yml，填入真实值
#   3. 提交到 main 分支
#   4. 验证可读：curl -sL https://cnb.cool/gkzhou/cndb-secrets/-/raw/main/deploy-env.yml
#
# ⚠️ 本文件是模板，不要把真实凭证提交到 cndb 主仓库。
# ═══════════════════════════════════════════════════════════════════

# ── 腾讯云 TCR（镜像仓库）─────────────────────────────────────
# 域名不含命名空间，不带 https://
TCR_REGISTRY: your-registry.tencentcloudcr.com
# 命名空间（企业版为「企业名」，个人版通常与用户名同）
TCR_GROUP: your-namespace

# 服务账号：必须把官方默认的 tcr$ 改成 tcr@
# （部分 CI 平台无法正确处理 $ 符号，这是踩过的坑）
TCR_USERNAME: tcr@cndb-deploy
TCR_PASSWORD: REPLACE_ME

# ── 生产服务器 SSH ────────────────────────────────────────────
SSH_HOST: 1.2.3.4
SSH_PORT: "22"
SSH_USERNAME: root
# 整段私钥原文，含 BEGIN/END 两行；缩进保留但不要加额外空格
SSH_PRIVATE_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  REPLACE_ME
  -----END OPENSSH PRIVATE KEY-----

# ═══════════════════════════════════════════════════════════════════
# 不需要在这里配置的项（说明为什么）：
#
#   CNDB_IMAGE       写在服务器的 /opt/cndb/.env，由 deploy.sh 原子更新
#   JWT_SECRET       同上，且流水线会校验它不是 CHANGE_ME 占位值
#   CNDB_VOLUME      同上（默认 cndb-data）
#   CNB_TOKEN        CNB 流水线内置触发者凭据，无需手填；
#                    推CNB 制品库时由平台自动注入 login 能力
#
# 生成 SSH 私钥（若还没有）：
#   ssh-keygen -t ed25519 -C cndb-deploy -f ~/.ssh/cndb_deploy -N ""
#   把 ~/.ssh/cndb_deploy（私钥，不是 .pub）内容填到 SSH_PRIVATE_KEY，
#   并把 ~/.ssh/cndb_deploy.pub 的公钥追加到服务器的 ~/.ssh/authorized_keys
# ═══════════════════════════════════════════════════════════════════