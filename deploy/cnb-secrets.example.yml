# ═══════════════════════════════════════════════════════════════════
# CNB 部署凭证 —— 复制到密钥仓库 gkzhou/cndb-secrets 的 deploy-env.yml
#
# 目标镜像仓库：ccr.ccs.tencentyun.com/pydev/cndb（腾讯云 TCR 个人版）
# 完整镜像地址形如 ccr.ccs.tencentyun.com/pydev/cndb:v0.3.0
#                    └─REGISTRY─┘ └GROUP┘ └REPO┘
#
# ⚠️ 前置条件：密钥仓库必须设为【公开可读】
#   CNB 的 imports 会匿名拉取该文件，私有仓库会被拒绝
#   （实测私有时 raw URL 返回 404，API 报 "Secret repos do not support token access"）。
#   公开 ≠ 危险：仓库里只有凭证，访问者本来就知道你的域名与用户名；
#   真正的风险是「公开但没人知道」，而你的仓库名 cndb-secrets 不会被搜索到。
#   如果后续 CNB 支持密钥仓库授权模式，可改回私有。
# ═══════════════════════════════════════════════════════════════════

# ── TCR 镜像仓库 ──────────────────────────────────────────────
# 域名（不含命名空间，不带 https:// 与末尾斜杠）
TCR_REGISTRY: ccr.ccs.tencentyun.com

# 命名空间。你给的地址是 ccr.ccs.tencentyun.com/pydev/cndb，
# 即命名空间 pydev + 仓库名 cndb
TCR_GROUP: pydev

# 仓库名。单独拆出来是因为流水线的 tag 拼接需要它。
# 与项目同名，改其他名字时服务器 .env 的 CNDB_IMAGE 也要同步改。
TCR_REPO: cndb

# TCR 登录用户名。
# 个人版通常直接用腾讯云主账号名（或绑定的同名用户名）；
# 若你创建了专用服务账号，形如 tcr$cndb-deploy，请把 $ 改成 @ —— 部分 CI 平台
# 无法正确处理 $ 符号（这是本项目在 GitHub Actions 侧踩过的坑）。
TCR_USERNAME: tcr@替换成你的TCR用户名

# 访问令牌 / 密码。
# 获取路径：腾讯云控制台 → 容器镜像服务 TCR → 访问凭证 → 新建临时/长期凭证。
# 注意：个人版控制台里的「密码」与「令牌」二选一，填你实际能登录的那个。
TCR_PASSWORD: REPLACE_ME

# ── 生产服务器 SSH ────────────────────────────────────────────
SSH_HOST: REPLACE_ME
SSH_PORT: "22"
SSH_USERNAME: root

# 整段私钥原文，必须含 BEGIN/END 两行。
# YAML 缩进会被保留，所以每行前统一两个空格缩进即可，不要加额外空格。
SSH_PRIVATE_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  REPLACE_ME
  -----END OPENSSH PRIVATE KEY-----

# ═══════════════════════════════════════════════════════════════════
# 不需要在这里配置的项（以及为什么）
#
#   CNDB_IMAGE    写在服务器 /opt/cndb/.env，由 deploy.sh 原子更新为
#                 ccr.ccs.tencentyun.com/pydev/cndb:<版本号>
#   JWT_SECRET    同上。流水线会在部署前校验它不是 CHANGE_ME 占位值
#   CNDB_VOLUME   同上（默认 cndb-data）
#   CNB_TOKEN     CNB 流水线内置触发者凭据，无需手填。
#                 推 CNB 制品库时平台自动注入 login 能力
#
# ── 填完后的验证（两条都要过）────────────────────────────────
#   1. 仓库已公开且文件可匿名读：
#      curl -sL https://cnb.cool/gkzhou/cndb-secrets/-/git/raw/main/deploy-env.yml
#      应返回文件内容（凭证明文，**不要在公开场合贴到聊天/issue**）
#   2. 服务器上的 .env 里 CNDB_IMAGE 前缀与 TCR_REPO 保持一致：
#      CNDB_IMAGE=ccr.ccs.tencentyun.com/pydev/cndb:v0.3.0
#      deploy.sh 会取 CNDB_IMAGE 剥掉版本段再拼新 tag，
#      所以这里写死仓库名没问题，不必随版本改。
#
# ── 生成 SSH 私钥（若还没有）─────────────────────────────────
#   ssh-keygen -t ed25519 -C cndb-deploy -f ~/.ssh/cndb_deploy -N ""
#   私钥 ~/.ssh/cndb_deploy     →填到上面的 SSH_PRIVATE_KEY
#   公钥 ~/.ssh/cndb_deploy.pub →追加到服务器的 ~/.ssh/authorized_keys
# ═══════════════════════════════════════════════════════════════════