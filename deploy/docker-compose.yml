# 生产编排：web（gunicorn）+ PostgreSQL 17，一键 docker compose up -d
# 首次启动后执行迁移：docker compose exec web python manage.py migrate
services:
  db:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: cndb
      POSTGRES_USER: cndb
      POSTGRES_PASSWORD: ${CNDB_DB_PASSWORD:?请在 .env 或环境变量中设置 CNDB_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cndb -d cndb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CNDB_SECRET_KEY: ${CNDB_SECRET_KEY:?请在 .env 或环境变量中设置 CNDB_SECRET_KEY}
      CNDB_ALLOWED_HOSTS: ${CNDB_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CNDB_DB: postgres
      CNDB_DB_NAME: cndb
      CNDB_DB_USER: cndb
      CNDB_DB_PASSWORD: ${CNDB_DB_PASSWORD}
      CNDB_DB_HOST: db
      CNDB_DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
