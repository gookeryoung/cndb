# 生产反代配置：nginx 作为入口，静态资源直出 + 动态请求转发 uvicorn
# 本文件被 compose 挂载为 /etc/nginx/conf.d/default.conf

# gzip 压缩（文本类资源）
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

upstream cndb_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限（Excel/CSV 大文件导入）
    client_max_body_size 50m;

    # 容器自检端点：直接返回，不回源到应用
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # /api/* 动态请求反代 uvicorn
    location /api/ {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # /docs /openapi.json FastAPI 自动文档
    location /docs {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
    }

    # SPA fallback：所有非 /api/* 请求走 index.html（已由 uvicorn 处理，此处透传）
    location / {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

