# 生产反代配置：nginx 作为入口，静态资源直出 + 动态请求转发 uvicorn
# 本文件被 compose 挂载为 /etc/nginx/conf.d/default.conf
# 前端构建产物需先拷贝到 nginx 的 /usr/share/nginx/html/ 目录
#   cp -r src/cndb/static/* /usr/share/nginx/html/

# gzip 压缩（文本类资源）
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

upstream cndb_app {
    server app:8000;
}

# 前端构建产物目录（Vite build outDir = src/cndb/static）
# compose 里需要把这个目录挂载进来，或者用多阶段构建 COPY
set $web_root /usr/share/nginx/html;

server {
    listen 80;
    server_name _;

    # 上传体积上限（Excel/CSV 大文件导入）
    client_max_body_size 50m;

    # 容器自检端点：直接返回，不回源到应用
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # ── /assets/* 静态资源直出（文件名带 hash，可强缓存 1 年）──
    # 浏览器拿到新部署的 chunk 会因为文件名变化自动下载新的
    location /assets/ {
        alias $web_root/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── /api/* 动态请求反代 uvicorn ──
    location /api/ {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /docs /openapi.json FastAPI 自动文档 ──
    location /docs {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://cndb_app;
        proxy_set_header Host $host;
    }

    # ── SPA 静态文件 + fallback ──
    # 逻辑：先尝试直接命中静态文件（index.html, favicon.svg 等），
    # 不存在的 HTML 页面请求回退到 index.html（由前端路由接管），
    # 非 HTML 请求（如缺失的静态资源）返回 404
    location / {
        # 顶层静态资源弱缓存（favicon.svg 等，没有 hash）
        add_header Cache-Control "no-cache";

        # 命中静态文件直接返回
        try_files $uri @spa_fallback;
    }

    location @spa_fallback {
        # 仅对浏览器页面请求回退 index.html
        # 缺失的 /assets/ 文件、API 路由等直接返回 404
        set $fallback 0;
        if ($http_accept ~ "text/html") {
            set $fallback 1;
        }
        if ($request_uri ~ ^/(api|assets)/) {
            set $fallback 0;
        }

        if ($fallback = 1) {
            rewrite ^ /index.html last;
        }
        return 404;
    }
}

