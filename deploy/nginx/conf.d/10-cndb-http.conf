# ═══════════════════════════════════════════════════════════════════
# cndb 反向代理的 http 级配置（不能放进 server 块）
#
# 落点：/etc/nginx/conf.d/10-cndb-http.conf
# 挂载方式：docker-compose.prod.yml 里**单文件只读挂载**——不能整目录挂载，
# 否则官方镜像的 envsubst 无法写入同目录的 default.conf，容器会启动失败。
#
# 内容：
#   1) /assets/* 的代理缓存池（server 块里的 location 引用该 zone）；
#   2) gzip 兜底（上游 FastAPI 只压缩 ≥1KB 的响应，这里补小响应与其它文本类型）。
# ═══════════════════════════════════════════════════════════════════

# 静态资源缓存：/assets/* 文件名带内容 hash 且上游声明 immutable，命中后不再回源。
# 生产应用是单进程 uvicorn（workers=1），静态请求回源会挤占业务请求的处理时间。
# 目录由 nginx 启动时按本行自动创建，无需额外挂卷。
proxy_cache_path /var/cache/nginx/cndb_assets levels=1:2 keys_zone=cndb_assets:10m
                 inactive=7d max_size=512m use_temp_path=off;

# gzip 兜底：已带 Content-Encoding 的响应不会被重复压缩。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
