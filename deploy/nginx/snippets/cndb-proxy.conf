# ═══════════════════════════════════════════════════════════════════
# cndb 反向代理公共片段（HTTP / HTTPS 两个 server 块共用）
#
# 挂载点：/etc/nginx/snippets/cndb-proxy.conf
# 被以下文件 include：
#   - /etc/nginx/templates/default.conf.template  （HTTP :80）
#   - /etc/nginx/extra/ssl.conf                   （HTTPS :443，可选）
#
# 关键点：代理需覆盖客户端 IP 头（见下方说明）。
#
# 关于客户端 IP：这里用 $remote_addr **覆盖** X-Forwarded-For，而不是往上追加。
# 原因：应用侧以 `--forwarded-allow-ips *` 运行（信任代理头），若保留客户端自带的 XFF，
# 攻击者可伪造 IP 绕过登录限流；由 nginx 处覆盖为真实对端地址即可消除该风险。
# 相应地，启用反代时应把 CNDB_BIND 设为 127.0.0.1:8000，让应用只接受本机代理访问。
# ═══════════════════════════════════════════════════════════════════

# ── 带 hash 的构建产物：独立 location + 代理缓存 ──────────────────
# 上游已返回 `Cache-Control: public, max-age=31536000, immutable`；这里在代理层再缓存，
# 避免重复访问回源到单进程 uvicorn。缓存池定义在 conf.d/10-cndb-http.conf。
location /assets/ {
    proxy_pass http://cndb_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache cndb_assets;
    # 上游按 Accept-Encoding 返回不同变体，缓存键必须带上，避免把 gzip 响应发给
    # 不支持压缩的客户端（nginx 默认不按 Vary 拆分缓存）。
    proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";
    proxy_cache_valid 200 7d;
    # 回源故障时用旧副本兜底，静态资源内容由 hash 保证不变
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    # 便于排查缓存命中率，不影响响应体
    add_header X-Asset-Cache $upstream_cache_status always;
}

# ── 应用与前端静态资源 ────────────────────────────────────────────
location / {
    proxy_pass http://cndb_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CSV 导入 / 备份恢复可能上传大文件（默认 1m 会直接 413）
    #
    # ⚠️ 必须写常量，不能用 ${CNDB_MAX_BODY_SIZE}：官方 nginx 镜像的 envsubst
    # 只渲染 /etc/nginx/templates/*.template，本片段挂载在 snippets/ 下不会被
    # 替换，变量名会原样进入配置导致 nginx 启动失败。又因本片段被静态的
    # extra/ssl.conf 一并 include，ssl.conf 也无法传参。改上传上限请直接改此行。
    client_max_body_size 512m;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
