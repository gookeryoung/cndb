# ═══════════════════════════════════════════════════════════════════
# cndb 反向代理公共片段（HTTP / HTTPS 两个 server 块共用）
#
# 挂载点：/etc/nginx/snippets/cndb-proxy.conf
# 被以下文件 include：
#   - /etc/nginx/templates/default.conf.template  （HTTP :80）
#   - /etc/nginx/extra/ssl.conf                   （HTTPS :443，可选）
#
# 关键点：**实时协作走 WebSocket，必须放行 Upgrade 头**，
# 否则 /api/v1/ws 无法升级、前端会一直显示"重连中…"（HTTP 功能不受影响，故极易被忽略）。
#
# 关于客户端 IP：这里用 $remote_addr **覆盖** X-Forwarded-For，而不是往上追加。
# 原因：应用侧以 `--forwarded-allow-ips *` 运行（信任代理头），若保留客户端自带的 XFF，
# 攻击者可伪造 IP 绕过登录限流；由 nginx 处覆盖为真实对端地址即可消除该风险。
# 相应地，启用反代时应把 CNDB_BIND 设为 127.0.0.1:8000，让应用只接受本机代理访问。
# ═══════════════════════════════════════════════════════════════════

# ── 实时通道：WebSocket 升级 ──────────────────────────────────────
# proxy_read_timeout 必须远大于应用心跳（服务端每 25s 发 ping），
# 否则代理会在空闲时切断长连接。
location /api/v1/ws {
    proxy_pass http://cndb_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 实时消息不能被缓冲
    proxy_buffering off;

    # 令牌在 query（浏览器 WebSocket 无法自定义请求头）→ 该 location 用专用格式只记 $uri，
    # 避免 access token 落进 nginx 访问日志。
    access_log /var/log/nginx/access.log cndb_ws;
}

# ── 应用与前端静态资源 ────────────────────────────────────────────
location / {
    proxy_pass http://cndb_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CSV 导入 / 备份恢复可能上传大文件（默认 1m 会直接 413）
    client_max_body_size ${CNDB_MAX_BODY_SIZE};

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
