# CodeUp CI 流水线 — cndb
# 等价迁移自 .github/workflows/ci.yml，工具链版本与 GitHub Actions 对齐。
#
# 触发：push main/develop 分支、push tag
# 并行 3 个 job（阶段内默认并行，无 needs）：
#   lint-typecheck  →  gitkeep + ruff + pyrefly（Python 静态门禁）
#   frontend-check  →  eslint（缓存目录）+ vitest coverage + vite build（含 tsc -b）+ bundle budget
#   test            →  pytest --cov（95% 门槛，Python 3.12）
#
# 运行环境：CodeUp 公共 K8s 集群 public/cn-beijing + alinux3:latest 容器
#
# 并行与排队优化：
#   - 同一 stage 内 job 默认并行，无需显式声明依赖
#   - maxRunningJobInstances 默认为 1，会导致同 job 在多次触发间排队（frontend-check
#     尤其受影响），显式调高至 4 允许多实例并行
#   - preemptOldest 等价于 GitHub Actions 的 concurrency.cancel-in-progress：
#     新推送抢占旧运行，避免过期实例占用公共集群资源加剧排队
#   - cache 远端缓存 pnpm store、uv cache 与前端 lint 增量产物，缩短依赖安装与静态检查时间
#
# Node/pnpm 安装提速：不用 nodesource rpm + dnf（元数据拉取慢，约 160s），改为
# npmmirror 镜像 tar 包直装 Node + npmmirror registry 安装 pnpm，Node 安装目录
# 纳入远端缓存后二次运行跳过下载，setup 通常降至 10s 内

# 流水线并发：单实例 + 抢占旧运行（等价 GitHub concurrency.cancel-in-progress）
concurrencyConfig:
  maxRunningPipelineInstances: 1
  pipelineMaxRunningBehavior: preemptOldest
  # 允许同一 job 在连续触发的流水线实例间并行，避免排队等服务器
  maxRunningJobInstances: 4

# 远端缓存：跨运行复用依赖下载（公共构建集群仅支持 remote）
cache:
  cacheDirs:
    - /root/.cache/uv        # uv 下载缓存（Python 依赖）
    - /root/.local/share/uv  # uv 托管的 Python 解释器与虚拟环境工具链
    - /root/.pnpm-store      # pnpm store（setup 步骤中显式指定 store-dir）
    - /root/.cache/frontend  # 前端 lint 增量缓存（eslintcache，容器内跨运行复用）
    - /root/.local/node-v22.14.0  # Node 运行时（命中后跳过镜像下载解压）
  cacheMode: remote

name: cndb-ci

sources:
  cndb:
    type: codeup
    name: cndb
    endpoint: https://codeup.aliyun.com/cndev/python/cndb.git
    branch: main
    triggerEvents:
      - push
      - tagPush
    certificate:
      type: serviceConnection
      serviceConnection: x9jakytjkjrnm8sb

stages:
  check_stage:
    name: CI 门禁
    jobs:
      # ── Python 静态门禁 ─────────────────────────────────────────
      lint_typecheck:
        name: Lint & Typecheck (Python)
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: MEDIUM_2C4G
        timeoutMinutes: 15
        steps:
          setup:
            name: 安装 Python 工具链
            step: Command
            with:
              run: |
                set -euo pipefail
                echo "[setup] install uv ..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.local/bin:$PATH"
                uv python install 3.12
          check:
            name: 运行 Python 门禁
            step: Command
            with:
              run: |
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                uv sync --frozen --extra lint --python 3.12
                uv run python scripts/check_gitkeep.py
                uv run ruff check src tests
                uv run ruff format --check src tests
                uv run pyrefly check

      # ── 前端门禁 ─────────────────────────────────────────────────
      frontend_check:
        name: Frontend Check
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: MEDIUM_2C4G
        timeoutMinutes: 20
        steps:
          setup:
            name: 安装 Node/pnpm
            step: Command
            with:
              run: |
                set -euo pipefail
                # Node 以 npmmirror 镜像 tar 包直装（替代 nodesource rpm+dnf，避开元数据
                # 拉取与包管理器开销）；安装目录纳入远端缓存，命中后跳过下载解压
                NODE_VERSION=22.14.0
                NODE_DIR=/root/.local/node-v$NODE_VERSION
                # 远端缓存未命中时 /root/.local 可能不存在，解压前先创建
                mkdir -p /root/.local
                if [ ! -x "$NODE_DIR/bin/node" ]; then
                  echo "[setup] download Node v$NODE_VERSION ..."
                  curl -fsSL "https://npmmirror.com/mirrors/node/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" | tar -xJ -C /root/.local
                  mv /root/.local/node-v$NODE_VERSION-linux-x64 "$NODE_DIR"
                fi
                export PATH="$NODE_DIR/bin:$PATH"
                # pnpm 经 npmmirror registry 安装，避免默认 registry 跨境慢速
                npm config set registry https://registry.npmmirror.com
                npm install -g pnpm@12.4.2
                pnpm config set store-dir /root/.pnpm-store
                node --version
                pnpm --version
          check:
            name: 运行前端门禁
            step: Command
            with:
              run: |
                set -euo pipefail
                # Node 安装在 setup 步骤的非系统路径（见上），各步骤独立 shell 需注入 PATH
                export PATH="/root/.local/node-v22.14.0/bin:$PATH"
                cd frontend
                pnpm install --frozen-lockfile --prefer-offline
                # eslint 直调以把增量缓存定位到远端缓存目录（工作区内缓存每次容器都是冷的）
                ./node_modules/.bin/eslint . --cache --cache-location /root/.cache/frontend/eslintcache
                # 不单独跑 typecheck：pnpm build 内含 tsc -b，等价覆盖
                # CI=1 使 vitest 只输出 text + json-summary 覆盖率报告（见 vite.config.ts）
                CI=1 pnpm test:coverage
                pnpm build
                pnpm bundle:budget

      # ── Python 单测 + 覆盖率 ─────────────────────────────────────
      test:
        name: Test (Python 3.12)
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: LARGE_4C8G
        timeoutMinutes: 20
        steps:
          setup:
            name: 安装 Python 工具链
            step: Command
            with:
              run: |
                set -euo pipefail
                echo "[setup] install uv ..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.local/bin:$PATH"
                uv python install 3.12
          test:
            name: 运行单测（覆盖率门槛 95%）
            step: Command
            with:
              run: |
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                uv sync --frozen --extra test --python 3.12
                uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 \
                  --cov-report=term-missing -n auto
