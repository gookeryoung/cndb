# CodeUp CI 流水线 — cndb
# 等价迁移自 .github/workflows/ci.yml，工具链版本与 GitHub Actions 对齐。
#
# 触发：push main/develop 分支、push tag
# 并行 4 个 job（阶段内默认并行，无 needs）：
#   lint_typecheck  → gitkeep + adr-check + ruff + pyrefly（Python 静态门禁）
#   frontend_static → eslint + build(含 tsc -b) + bundle budget（前端静态链）
#   frontend_test   → vitest coverage（唯一长尾，独占 4 核实例）
#   test            → pytest --cov（95% 门槛，Python 3.12）
#
# 前端拆成「静态链 / 覆盖率」两个 job：二者并行后前端关键路径只由 coverage 决定。
# coverage 未分片，因云效普通 Command job 无法消费 ArtifactUpload 产物。
#
# 运行环境：CodeUp 公共 K8s 集群 public/cn-beijing + alinux3 容器。
# 排队优化：maxRunningJobInstances=4 允许同 job 并行；preemptOldest 抢占旧运行；
# cache 远端复用 pnpm store / uv cache / 前端 lint 增量产物。
# Node/pnpm 以 npmmirror 镜像 tar 包直装并纳入缓存，二次运行 setup 通常降至 10s 内。

# 流水线并发：单实例 + 抢占旧运行（等价 GitHub concurrency.cancel-in-progress）
concurrencyConfig:
  maxRunningPipelineInstances: 1
  pipelineMaxRunningBehavior: preemptOldest
  # 允许同一 job 在连续触发实例间并行，避免排队等服务器
  maxRunningJobInstances: 4

# 远端缓存：跨运行复用依赖下载（公共构建集群仅支持 remote）
cache:
  cacheDirs:
    - /root/.cache/uv        # uv 下载缓存（Python 依赖）
    - /root/.local/share/uv  # uv 托管的 Python 解释器与虚拟环境工具链
    - /root/.pnpm-store      # pnpm store（setup 步骤中显式指定 store-dir）
    - /root/.cache/frontend  # 前端 lint 增量缓存（eslintcache，容器内跨运行复用）
    - /root/.local/node-v22.14.0  # Node 运行时（命中后跳过镜像下载解压）
    - /root/.cache/ms-playwright    # Playwright 浏览器（为未来 e2e job 预热）
  cacheMode: remote

name: cndb-ci

sources:
  cndb:
    type: codeup
    name: cndb
    endpoint: https://codeup.aliyun.com/cndev/python/cndb.git
    branch: main
    triggerEvents:
      - push
      - tagPush
    certificate:
      type: serviceConnection
      serviceConnection: x9jakytjkjrnm8sb

stages:
  check_stage:
    name: CI 门禁
    jobs:
      # ── Python 静态门禁 ─────────────────────────────────────────
      lint_typecheck:
        name: Lint & Typecheck (Python)
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: MEDIUM_2C4G
        timeoutMinutes: 15
        steps:
          setup:
            name: 安装 Python 工具链
            step: Command
            with:
              run: |
                set -euo pipefail
                echo "[setup] install uv ..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.local/bin:$PATH"
                uv python install 3.12
          check:
            name: 运行 Python 门禁
            step: Command
            with:
              run: |
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                uv sync --frozen --extra lint --python 3.12
                uv run python scripts/check_gitkeep.py
                uv run python scripts/check_adr_landing.py
                uv run ruff check src tests
                uv run ruff format --check src tests
                uv run pyrefly check

      # ── 前端静态链（独立 job，与覆盖率测试并行）────────────────────
      frontend_static:
        name: Frontend Static
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          # 静态链只跑 eslint + build + bundle budget，2 核足够
          instanceType: MEDIUM_2C4G
        timeoutMinutes: 20
        steps:
          setup:
            name: 安装 Node/pnpm
            step: Command
            with:
              run: |
                set -euo pipefail
                # Node 以 npmmirror 镜像 tar 包直装（替代 nodesource rpm+dnf）；目录纳入缓存，命中即跳过
                NODE_VERSION=22.14.0
                NODE_DIR=/root/.local/node-v$NODE_VERSION
                # 缓存未命中时 /root/.local 可能不存在，解压前先创建
                mkdir -p /root/.local
                if [ ! -x "$NODE_DIR/bin/node" ]; then
                  echo "[setup] download Node v$NODE_VERSION ..."
                  curl -fsSL "https://npmmirror.com/mirrors/node/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" | tar -xJ -C /root/.local
                  mv /root/.local/node-v$NODE_VERSION-linux-x64 "$NODE_DIR"
                fi
                export PATH="$NODE_DIR/bin:$PATH"
                # pnpm 经 npmmirror registry 安装，避免默认 registry 跨境慢速
                npm config set registry https://registry.npmmirror.com
                npm install -g pnpm@12.4.2
                pnpm config set store-dir /root/.pnpm-store
                node --version
                pnpm --version
          check:
            name: 运行前端静态门禁
            step: Command
            with:
              run: |
                set -euo pipefail
                # Node 安装在 setup 步骤的非系统路径（见上），各步骤独立 shell 需注入 PATH
                export PATH="/root/.local/node-v22.14.0/bin:$PATH"
                cd frontend
                pnpm install --frozen-lockfile --prefer-offline
                # eslint 直调，把增量缓存定位到远端缓存目录（工作区内缓存每次都是冷的）
                ./node_modules/.bin/eslint . --cache --cache-location /root/.cache/frontend/eslintcache
                # build 内含 tsc -b（等价覆盖类型检查）；bundle budget 依赖 build 产物，故串行
                pnpm build
                pnpm bundle:budget

      # ── 前端覆盖率测试（唯一长尾，独占 4 核实例）────────────────────
      frontend_test:
        name: Frontend Test (coverage)
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          # 覆盖率测试为 CPU 密集型长尾，核数直接决定时长；VITEST_MAX_WORKERS 见 vite.config.ts 配额逻辑。
          instanceType: LARGE_4C8G
        timeoutMinutes: 20
        steps:
          setup:
            name: 安装 Node/pnpm
            step: Command
            with:
              run: |
                set -euo pipefail
                NODE_VERSION=22.14.0
                NODE_DIR=/root/.local/node-v$NODE_VERSION
                mkdir -p /root/.local
                if [ ! -x "$NODE_DIR/bin/node" ]; then
                  echo "[setup] download Node v$NODE_VERSION ..."
                  curl -fsSL "https://npmmirror.com/mirrors/node/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" | tar -xJ -C /root/.local
                  mv /root/.local/node-v$NODE_VERSION-linux-x64 "$NODE_DIR"
                fi
                export PATH="$NODE_DIR/bin:$PATH"
                npm config set registry https://registry.npmmirror.com
                npm install -g pnpm@12.4.2
                pnpm config set store-dir /root/.pnpm-store
                node --version
                pnpm --version
          check:
            name: 运行前端覆盖率门禁
            step: Command
            with:
              run: |
                set -euo pipefail
                export PATH="/root/.local/node-v22.14.0/bin:$PATH"
                cd frontend
                pnpm install --frozen-lockfile --prefer-offline
                # 只需 text + json-summary（html 为 opt-in），省去写数百个 html；CI=1 对齐既有口径
                CI=1 VITEST_MAX_WORKERS=4 pnpm test:coverage

      # ── Python 单测 + 覆盖率 ─────────────────────────────────────
      test:
        name: Test (Python 3.12)
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
          instanceType: LARGE_4C8G
        timeoutMinutes: 20
        steps:
          setup:
            name: 安装 Python 工具链
            step: Command
            with:
              run: |
                set -euo pipefail
                echo "[setup] install uv ..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.local/bin:$PATH"
                uv python install 3.12
          test:
            name: 运行单测（覆盖率门槛 95%）
            step: Command
            with:
              run: |
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                uv sync --frozen --extra test --python 3.12
                # 实例 4 核，显式 -n 4（-n auto 可能读到宿主核数导致超订）
                uv run pytest -m "not slow" --cov=cndb --cov-fail-under=95 \
                  --cov-report=term-missing -n 4
