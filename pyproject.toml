[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0,<0.126.0", # 0.126+ 要求 pydantic>=2.7，与 pydantic<2.7（Win7 兼容）冲突
    "fastapi-offline>=1.7.0",
    "pydantic-settings>=2.2.0,<2.9.0", # 与 pydantic <2.7 对齐（Win7 兼容）
    "pydantic>=2.6.0,<2.7.0", # 2.7+ 带出 pydantic-core>=2.17，引入 Win8+ kernel32.GetSystemTimePreciseAsFileTime
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "bcrypt>=3.2.2,<4.0.0", # bcrypt 4.x 用 Rust 重写，Rust 1.75+ 停止 Win7 支持，_bcrypt.pyd 在 Win7 上因 ProcessPrng 缺失无法加载；3.x 是 CFFI 实现，Win7 兼容
    "cryptography>=41.0.0,<42.0.0", # cryptography 42+ 引入 Rust _rust 模块，Win7 上加载失败；41.x 仍为纯 C/OpenSSL，Win7 兼容
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "httpx2>=1.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "jinja2>=3.1.0",
    "chardet>=7.6.0",
]

description     = "cndb - metadata-driven collaborative database platform (FastAPI + SQLAlchemy + Plugin architecture)"
license         = "MIT"
name            = "cndb"
readme          = "README.md"
requires-python = ">=3.12"
version         = "0.1.11"

[project.scripts]
cndb  = "cndb.runner:main"
cndbw = "cndb.gui.main_window:main"

[project.optional-dependencies]
dev = ["cndb[lint,test,docs]"]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = ["pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "pytest-html>=4.1.1", "pytest-timeout>=2.3.0", "pytest-xdist>=3.6.1", "pytest>=8.0.0"]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/cndb"]
exclude = ["src/cndb/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/cndb/py.typed" = "cndb/py.typed"
"src/cndb/static" = "cndb/static"
"examples/datasets" = "cndb/datasets"

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/node_modules/**",
    "frontend/.auth/**",
    "frontend/playwright-report/**",
    "frontend/test-results/**",
    "frontend/dist/**",
    ".benchmarks/**",
    ".trae/**",
    ".trae-cn/**",
    ".tox/**",
    ".mypy_cache/**",
    ".pyrefly_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src/cndb/static" = "src/cndb/static"
"examples/datasets" = "examples/datasets"

# ── fspack 打包配置 ────────────────────────────────────────
[tool.fspack]
entry-app-types = { cndb = "cli", cndbw = "gui" }
web-static-dirs = ["src/cndb/static"]
#data-dirs = ["src/alembic/versions"]
#pyc_strip = true
#no_site   = true
# gui = Windows 上用 pythonw 无控制台；Linux/macOS 用 python + DISPLAY

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = ["cndb[dev]"]

[tool.coverage.run]
omit = [
    "src/cndb/runner.py",
    "src/cndb/seed.py",
    "src/cndb/gui/**",
    "src/cndb/plugins/tables/routers/files.py",
]
