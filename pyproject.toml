[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0",
    "fastapi-offline>=1.7.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
]

description     = "cndb - metadata-driven collaborative database platform (FastAPI + SQLAlchemy + Plugin architecture)"
license         = "MIT"
name            = "cndb"
readme          = "README.md"
requires-python = ">=3.13"
version         = "0.1.2"

# CLI 入口（短名 cndb）
[project.scripts]
cndb = "cndb.runner:main"

[project.optional-dependencies]
# 开发（包含 lint/test/docs）
dev = ["cndb[lint,test,docs]"]

docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = ["pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "pytest-html>=4.1.1", "pytest-timeout>=2.3.0", "pytest-xdist>=3.6.1", "pytest>=8.0.0"]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/cndb"]

[tool.hatch.build.targets.wheel.force-include]
# 类型标记文件
"src/cndb/py.typed" = "cndb/py.typed"
# 前端 Vite 构建产物（已由 make frontend-build 生成到 src/cndb/static/）
"src/cndb/static" = "cndb/static"
# 演示 seed 数据（CSV + views.json，cndb seed 命令依赖）
"examples/datasets" = "cndb/datasets"

[tool.hatch.build.targets.sdist]
# sdist 排除开发工具缓存和前端依赖
exclude = [
    "frontend/node_modules/**",
    "frontend/.auth/**",
    "frontend/playwright-report/**",
    "frontend/test-results/**",
    "frontend/dist/**",
    ".benchmarks/**",
    ".trae/**",
    ".trae-cn/**",
    ".tox/**",
    ".mypy_cache/**",
    ".pyrefly_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.hatch.build.targets.sdist.force-include]
# sdist 必须包含 wheel force-include 的源文件，否则从 sdist 构建 wheel 会找不到
"src/cndb/static" = "src/cndb/static"
"examples/datasets" = "examples/datasets"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = ["cndb[dev]"]

[tool.coverage.run]
omit = [
    "src/cndb/runner.py",
    "src/cndb/seed.py",
    "src/cndb/plugins/tables/routers/files.py",
]
