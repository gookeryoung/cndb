[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

# ── Platform-specific pinning conventions ────────────────────────
# The "upper bounds" below exist only for Windows (Win7/8) compatibility and are always
# attached to sys_platform=='win32'; non-Windows keeps the lower bound only. Duplicate entries
# for the same dependency are legal (mutually exclusive PEP 508 markers); the resolver picks
# whichever applies.
dependencies = [
    # fastapi.types in 0.126+ imports IncEx from pydantic.main (only available at runtime with
    # pydantic>=2.7), which conflicts with pydantic<2.7 on Windows, so pin 0.125.x
    "fastapi>=0.115.0,<0.126.0; sys_platform == 'win32'",
    "fastapi>=0.115.0; sys_platform != 'win32'",
    "fastapi-offline>=1.7.0",
    # Aligned with pydantic <2.7 (Win7 compatibility)
    "pydantic-settings>=2.2.0,<2.3.0; sys_platform == 'win32'",
    "pydantic-settings>=2.2.0; sys_platform != 'win32'",
    # 2.7+ pulls in pydantic-core>=2.17, which needs the Win8+ kernel32 API
    "pydantic>=2.6.0,<2.7.0; sys_platform == 'win32'",
    "pydantic>=2.6.0; sys_platform != 'win32'",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "bcrypt>=3.2.2,<4.0.0; sys_platform == 'win32'", # bcrypt 4.x is a Rust rewrite; Rust 1.75+ dropped Win7 support, so _bcrypt.pyd cannot load on Win7 (missing ProcessPrng); 3.x is the CFFI implementation and works on Win7
    "bcrypt>=3.2.2; sys_platform != 'win32'",
    # 42.0.6 depends on Win10+ DLLs and does not work on Win7; 42.0.4+ already fixes CVE-2024-26130
    "cryptography>=42.0.4,<42.0.6; sys_platform == 'win32'",
    "cryptography>=42.0.4; sys_platform != 'win32'",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx2>=1.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    # Derived PDF copies (rotation / horizontal flip, ADR 0164): pure Python, no native deps
    "pypdf>=5.0.0",
    "chardet>=7.6.0",
    "pyyaml>=6.0.3",
]

description     = "cndb - metadata-driven collaborative database platform (FastAPI + SQLAlchemy + Plugin architecture)"
license         = "MIT"
name            = "cndb"
readme          = "README.md"
# Windows effectively runs 3.12 (pinned dependencies are verified on that version only);
# platform differences are caught at runtime by the checks in __init__.py.
requires-python = ">=3.12,<3.15"
version         = "0.5.7"

[project.scripts]
cndb  = "cndb.cli.main:main"
cndbw = "cndb.gui.main_window:main"

[project.optional-dependencies]
dev  = ["cndb[lint,test]", "fspack>=0.6.11"]
# ruff is pinned to an exact version and must match the rev in .pre-commit-config.yaml,
# otherwise local hooks and CI disagree.
lint = ["pyrefly>=1.1.1", "ruff==0.17.6"]
# httpx: required by the starlette TestClient (the source itself only uses httpx2)
test = [
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    # Upper bound <2.5: 2.5.0 was officially yanked (accidental breaking change)
    "pytest-timeout>=2.3.0,<2.5",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url     = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/cndb"]
exclude  = ["src/cndb/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/cndb/py.typed" = "cndb/py.typed"
"src/cndb/static"   = "cndb/static"
"examples/datasets" = "cndb/datasets"
"examples/demo-packs" = "cndb/demo-packs"
"examples/help" = "cndb/help"

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/node_modules/**",
    "frontend/.auth/**",
    "frontend/playwright-report/**",
    "frontend/test-results/**",
    "frontend/dist/**",
    ".benchmarks/**",
    ".trae/**",
    ".trae-cn/**",
    ".mypy_cache/**",
    ".pyrefly_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src/cndb/static"   = "src/cndb/static"
"examples/datasets" = "examples/datasets"
"examples/demo-packs" = "examples/demo-packs"
"examples/help" = "examples/help"

# ── fspack packaging configuration ──────────────────────────────
[tool.fspack]
entry-app-types = { cndb = "cli", cndbw = "gui" }
web-static-dirs = ["src/cndb/static"]
# Document seeds are .md files: without data-dirs they are stripped by the fspack metadata
# exclusion rules (*.md/docs), leaving a packaged seed with folder structure but no content
data-dirs = ["examples/datasets", "examples/demo-packs", "examples/help"]
# gui = pythonw on Windows (no console); python + DISPLAY on Linux/macOS

[dependency-groups]
dev = [
    "cndb[dev]",
    "prek>=0.5.5",
]

# Coverage scope: configuration lives in this file only (a historical .coveragerc used to
# override pyproject settings; when both existed, omit was ignored and the threshold was
# distorted — it was deleted, do not create a new one)
[tool.coverage.run]
branch = true
source = ["cndb"]
omit = [
    # CLI entry points / GUI / file routes depend on a real environment, excluded from coverage
    "src/cndb/cli/main.py",
    "src/cndb/cli/seed/**",
    "src/cndb/gui/**",
    "src/cndb/plugins/tables/routers/files.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
