[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

# ── 平台相关钉版约定 ─────────────────────────────────────────────
# 下列版本「上限」仅为 Windows(Win7/8) 兼容而设，统一挂 sys_platform=='win32'；
# 非 Windows 只保留下限。同名依赖重复合法（PEP 508 标记互斥），解析器各取所需。
dependencies = [
    # 0.126+ 要求 pydantic>=2.7，与 Windows 上 pydantic<2.7 冲突
    "fastapi>=0.115.0,<0.162.0; sys_platform == 'win32'",
    "fastapi>=0.115.0; sys_platform != 'win32'",
    "fastapi-offline>=1.7.0",
    # 与 pydantic <2.7 对齐（Win7 兼容）
    "pydantic-settings>=2.2.0,<2.17.0; sys_platform == 'win32'",
    "pydantic-settings>=2.2.0; sys_platform != 'win32'",
    # 2.7+ 拉入 pydantic-core>=2.17，依赖 Win8+ 的 kernel32 API
    "pydantic>=2.6.0,<2.15.0; sys_platform == 'win32'",
    "pydantic>=2.6.0; sys_platform != 'win32'",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "bcrypt>=3.2.2,<4.0.0; sys_platform == 'win32'", # bcrypt 4.x 用 Rust 重写，Rust 1.75+ 停止 Win7 支持，_bcrypt.pyd 在 Win7 上因 ProcessPrng 缺失无法加载；3.x 是 CFFI 实现，Win7 兼容
    "bcrypt>=3.2.2; sys_platform != 'win32'",
    # 42.0.6 带 Win10+ DLL 依赖，Win7 不可用；42.0.4+ 已修 CVE-2024-26130
    "cryptography>=42.0.4,<51.0.0; sys_platform == 'win32'",
    "cryptography>=42.0.4; sys_platform != 'win32'",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx2>=1.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "chardet>=7.6.0",
]

description     = "cndb - metadata-driven collaborative database platform (FastAPI + SQLAlchemy + Plugin architecture)"
license         = "MIT"
name            = "cndb"
readme          = "README.md"
# Windows 实为 3.12（钉版依赖仅在该版本验证）；平台差异由 __init__.py 运行时校验兜底。
requires-python = ">=3.12,<3.15"
version         = "0.4.14"

[project.scripts]
cndb  = "cndb.cli.main:main"
cndbw = "cndb.gui.main_window:main"

[project.optional-dependencies]
dev  = ["cndb[lint,test]", "fspack>=0.6.11"]
# ruff 固定精确版本，须与 .pre-commit-config.yaml 的 rev 一致，否则本地 hook 与 CI 结果不一致。
lint = ["pyrefly>=1.1.1", "ruff==0.17.2"]
# httpx：starlette TestClient 运行所需（源码仅使用 httpx2）
test = [
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    # 上限 <2.5：2.5.0 已被官方 yanked（意外的破坏性变更）
    "pytest-timeout>=2.3.0,<2.5",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url     = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/cndb"]
exclude  = ["src/cndb/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/cndb/py.typed" = "cndb/py.typed"
"src/cndb/static"   = "cndb/static"
"examples/datasets" = "cndb/datasets"

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/node_modules/**",
    "frontend/.auth/**",
    "frontend/playwright-report/**",
    "frontend/test-results/**",
    "frontend/dist/**",
    ".benchmarks/**",
    ".trae/**",
    ".trae-cn/**",
    ".mypy_cache/**",
    ".pyrefly_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src/cndb/static"   = "src/cndb/static"
"examples/datasets" = "examples/datasets"

# ── fspack 打包配置 ────────────────────────────────────────
[tool.fspack]
entry-app-types = { cndb = "cli", cndbw = "gui" }
web-static-dirs = ["src/cndb/static"]
# 文档种子是 .md 文件：不声明 data-dirs 会被 fspack 的元数据排除规则（*.md/docs）
# 剥离，打包版 seed 只剩文档文件夹结构、没有文档正文
data-dirs = ["examples/datasets"]
# gui = Windows 上用 pythonw 无控制台；Linux/macOS 用 python + DISPLAY

[dependency-groups]
dev = [
    "cndb[dev]",
    "prek>=0.5.5",
]

# 覆盖率口径：配置集中在本文件（历史上的 .coveragerc 会覆盖 pyproject 配置，
# 两份共存时 omit 被忽略导致门槛失真，已删除，勿再新建）
[tool.coverage.run]
branch = true
source = ["cndb"]
omit = [
    # CLI 入口 / GUI / 文件路由依赖真实环境，不纳入自动化覆盖率门槛
    "src/cndb/cli/main.py",
    "src/cndb/cli/seed/**",
    "src/cndb/gui/**",
    "src/cndb/plugins/tables/routers/files.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
