[pytest]
markers = slow: marks tests as slow (deselect with '-m "not slow"')

testpaths = tests
timeout = 30
addopts = --dist loadfile
# 第三方依赖组合产生的已知告警（精确匹配，不屏蔽业务代码）
# - FastAPI 0.125 的 Pydantic v2 兼容层把 FieldInfo.attributes（含 deprecated）
#   整体传给 Pydantic Field；Windows 钉版 pydantic<2.7 尚不识别该关键字。
#   任一侧升级都会冲破 Win7/8 兼容上限，故在此屏蔽。
# - Starlette TestClient 导入期仍引用 anyio.abc.BlockingPortal 旧别名。
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active
    ignore:Using extra keyword arguments on:pydantic.warnings.PydanticDeprecatedSince20
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
