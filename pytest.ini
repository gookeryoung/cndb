[pytest]
markers = slow: marks tests as slow (deselect with "-m not slow")
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 防止单测 hang 死：全局默认 timeout 60s，Thread 方式（Windows 下 signal 不可用）
timeout = 60
timeout_method = thread
# xdist 分组策略：按文件分组，避免跨文件 fixture 依赖导致卡死
addopts = --dist loadfile
