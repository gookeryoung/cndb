[pytest]
markers = slow: marks tests as slow (deselect with '-m "not slow"')

testpaths = tests
timeout = 30
timeout_method = thread
# --dist worksteal 仅在传入 -n 时生效（Makefile test/cov 与 CI 均传值；裸跑 pytest 串行）。
addopts = --dist worksteal --durations=20
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active
    ignore::DeprecationWarning:starlette.testclient
    # FastAPI 在 Pydantic 2.6 上重建 Field 传入 deprecated= 触发 extra key 警告；
    # 上游修复需 2.10+，本项目因 Win7 兼容锁定 Pydantic <2.7
    ignore:Using extra keyword arguments on `Field`:pydantic.warnings.PydanticDeprecatedSince20
    # SQLAlchemy LegacyAPIWarning 源码已修复，保留此条作安全网
    ignore::sqlalchemy.exc.LegacyAPIWarning
