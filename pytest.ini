[pytest]
markers = slow: marks tests as slow (deselect with '-m "not slow"')

testpaths = tests
timeout = 30
# Concise failure output (requirement 0181 C4): the AI inner loop only needs "which test, which
# assertion line", not pytest's banner and the whole traceback context.
#   -q          drop per-file progress lines, failures are still listed one by one
#   --tb=short  keep only the head/tail of the traceback plus the failing line (use
#               `make test PYTEST_EXTRA='--tb=long'` for the full one)
#   --no-header drop the platform / plugin banner
# Coverage, assertions and the test set are unaffected; CI uses the same scope (one less log line).
addopts = --dist worksteal -q --tb=short --no-header
# Known warnings from the third-party combination (exact matches, business code is not muted)
# - The Pydantic v2 compatibility layer of FastAPI 0.125 passes FieldInfo.attributes
#   (deprecated included) straight to the Pydantic Field; the Windows pinned pydantic<2.7 does
#   not recognise that keyword yet. Upgrading either side would break the Win7/8 compatibility
#   ceiling, so it is muted here.
# - Starlette TestClient still references the old anyio.abc.BlockingPortal alias at import time.
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active
    ignore:Using extra keyword arguments on:pydantic.warnings.PydanticDeprecatedSince20
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
