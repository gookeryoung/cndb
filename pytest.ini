[pytest]
markers = slow: marks tests as slow (deselect with '-m "not slow"')
    
testpaths = tests
timeout = 30
timeout_method = thread
addopts = --dist worksteal --durations=20
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active
    ignore::DeprecationWarning:starlette.testclient
    # FastAPI 在 Pydantic 2.6 上重建 Field 时传入 deprecated=，被当作 extra key
    # 上游修复需 Pydantic 2.10+（含 deprecated 作为正式 Field 参数），
    # 但本项目因 Win7 兼容锁定 Pydantic <2.7
    ignore:Using extra keyword arguments on `Field`:pydantic.warnings.PydanticDeprecatedSince20
    # SQLAlchemy 2.0 LegacyAPIWarning 已在源码修复（db.query().get() → db.get()）
    # 保留此条作为安全网，防止测试引入新的遗留 API
    ignore::sqlalchemy.exc.LegacyAPIWarning