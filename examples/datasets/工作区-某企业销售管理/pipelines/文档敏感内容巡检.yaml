# 文档敏感内容巡检（需求 0102 示例）：身份证号 / 邮箱 / 公司内部信息。
# logic 用 and：三条规则同时命中才告警。
# - 「客户资料交接（敏感内容示例）」三项齐全 → 命中 3 条；
# - 「客户资料交接（仅邮箱对照）」只有邮箱 → 不告警（对照项）。
name: 文档敏感内容巡检
on:
  manual: true
  events: [document.saved]
jobs:
  敏感内容:
    steps:
      - uses: document/sensitive
        with:
          rules:
            - name: 身份证号
              patterns: ['\b\d{17}[\dXx]\b']
            - name: 邮箱地址
              patterns: ['\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b']
            - name: 内部资料
              keywords: [内部资料, 内部底价, 商业核心, 仅限内部]
          logic: 身份证号 and 邮箱地址 and 内部资料
        severity: warn
