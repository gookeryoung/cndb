# 文档敏感内容巡检（需求 0102 示例）：身份证号 / 邮箱 / 公司内部信息。
# 「客户资料交接（敏感内容示例）」文档含 3 处命中，其余文档为对照组；
# 需要「同时命中才告警」时把 logic 改为 all，或写布尔表达式（如 `身份证号 and 邮箱地址`）。
name: 文档敏感内容巡检
on:
  manual: true
  events: [document.saved]
jobs:
  敏感内容:
    steps:
      - uses: document/sensitive
        with:
          rules:
            - name: 身份证号
              patterns: ['\b\d{17}[\dXx]\b']
            - name: 邮箱地址
              patterns: ['\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b']
            - name: 内部资料
              keywords: [内部资料, 内部底价, 商业核心, 仅限内部]
          logic: 身份证号 or 邮箱地址 or 内部资料
        severity: warn
