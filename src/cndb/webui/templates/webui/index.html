{% load static_version %}<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cndb</title>
  <link rel="stylesheet" href="{% static_v 'webui/style.css' %}">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">cndb</div>
      <div class="workspace-row">
        <label class="field-label" for="workspace-select">工作区</label>
        <button type="button" id="workspace-create-btn" class="btn-ghost btn-mini" title="新建工作区">+</button>
      </div>
      <select id="workspace-select"></select>
      <div class="workspace-row">
        <label class="field-label">数据表</label>
        <button type="button" id="table-create-btn" class="btn-ghost btn-mini" title="新建表">+</button>
      </div>
      <ul id="table-list" class="table-list"></ul>
    </div>
    <div class="sidebar-bottom">
      <button type="button" id="member-btn" class="btn-ghost">成员</button>
      <span id="user-nickname">{{ nickname }}</span>
      <button type="button" id="logout-btn" class="btn-ghost">退出</button>
    </div>
  </aside>

  <main class="content">
    <header class="content-header">
      <div id="view-tabs" class="view-tabs"></div>
      <div class="toolbar">
        <button type="button" id="view-create-btn" class="btn-ghost btn-mini" title="新建视图">+视图</button>
        <button type="button" id="view-edit-btn" class="btn-ghost btn-mini" title="编辑当前视图">编辑</button>
        <button type="button" id="field-mgr-btn" class="btn-ghost btn-mini" title="字段管理">字段</button>
        <button type="button" id="field-add-btn" class="btn-ghost btn-mini" title="新增字段">+字段</button>
        <button type="button" id="export-btn" class="btn-ghost btn-mini" title="导出 CSV/JSON">导出</button>
        <button type="button" id="import-btn" class="btn-ghost btn-mini" title="导入 CSV">导入</button>
      </div>
      <span id="row-stats" class="row-stats"></span>
    </header>
    <div id="grid-status" class="grid-status"></div>
    <div id="form-hint" class="form-hint" hidden></div>
    <div id="kanban-board" class="kanban-board" hidden></div>
    <div id="calendar-view" class="calendar-view" hidden>
      <header class="calendar-nav">
        <button type="button" id="cal-prev" class="btn-ghost">上月</button>
        <span id="cal-title"></span>
        <button type="button" id="cal-next" class="btn-ghost">下月</button>
      </header>
      <div id="cal-grid" class="cal-grid"></div>
    </div>
    <div class="grid-wrap" id="grid-wrap">
      <table class="grid">
        <thead><tr id="grid-head"></tr></thead>
        <tbody id="grid-body"></tbody>
        <tfoot><tr id="grid-foot"></tr></tfoot>
      </table>
    </div>
    <footer class="pager" id="pager">
      <button type="button" id="page-prev" class="btn-ghost">上一页</button>
      <span id="page-info"></span>
      <button type="button" id="page-next" class="btn-ghost">下一页</button>
    </footer>
  </main>

  <aside id="row-detail" class="row-detail" hidden>
    <header class="row-detail-head">
      <span id="row-detail-title">行详情</span>
      <div>
        <button type="button" id="row-detail-edit" class="btn-ghost btn-mini">编辑</button>
        <button type="button" id="row-detail-close" class="btn-ghost">关闭</button>
      </div>
    </header>
    <dl id="row-detail-body" class="row-detail-body"></dl>
  </aside>

  <div id="modal-mask" class="modal-mask" hidden>
    <div class="modal">
      <header class="modal-head">
        <span id="modal-title">对话框</span>
        <button type="button" id="modal-close" class="btn-ghost btn-mini">关闭</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <input type="file" id="import-file" accept=".csv" hidden>
  <script src="{% static_v 'webui/app.js' %}"></script>
  <script src="{% static_v 'webui/actions.js' %}"></script>
</body>
</html>
