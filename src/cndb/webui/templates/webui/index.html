{% load static %}<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cndb</title>
  <link rel="stylesheet" href="{% static 'webui/style.css' %}">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">cndb</div>
      <label class="field-label" for="workspace-select">工作区</label>
      <select id="workspace-select"></select>
      <label class="field-label">数据表</label>
      <ul id="table-list" class="table-list"></ul>
    </div>
    <div class="sidebar-bottom">
      <span id="user-nickname">{{ nickname }}</span>
      <button type="button" id="logout-btn" class="btn-ghost">退出</button>
    </div>
  </aside>

  <main class="content">
    <header class="content-header">
      <div id="view-tabs" class="view-tabs"></div>
      <span id="row-stats" class="row-stats"></span>
    </header>
    <div id="grid-status" class="grid-status"></div>
    <div id="form-hint" class="form-hint" hidden></div>
    <div id="kanban-board" class="kanban-board" hidden></div>
    <div id="calendar-view" class="calendar-view" hidden>
      <header class="calendar-nav">
        <button type="button" id="cal-prev" class="btn-ghost">上月</button>
        <span id="cal-title"></span>
        <button type="button" id="cal-next" class="btn-ghost">下月</button>
      </header>
      <div id="cal-grid" class="cal-grid"></div>
    </div>
    <div class="grid-wrap" id="grid-wrap">
      <table class="grid">
        <thead><tr id="grid-head"></tr></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
    <footer class="pager" id="pager">
      <button type="button" id="page-prev" class="btn-ghost">上一页</button>
      <span id="page-info"></span>
      <button type="button" id="page-next" class="btn-ghost">下一页</button>
    </footer>
  </main>

  <aside id="row-detail" class="row-detail" hidden>
    <header class="row-detail-head">
      <span id="row-detail-title">行详情</span>
      <button type="button" id="row-detail-close" class="btn-ghost">关闭</button>
    </header>
    <dl id="row-detail-body" class="row-detail-body"></dl>
  </aside>

  <script src="{% static 'webui/app.js' %}"></script>
</body>
</html>
